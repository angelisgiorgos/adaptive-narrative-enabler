# Continuous integration: every push and pull request must pass the test suite and build a
# working Docker image for both services in compose.yaml (the API and the studio), so that
# what is merged can be deployed.
name: CI

on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python 3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"   # the Docker image's Python
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies (CPU-only PyTorch; no GPU or vLLM is needed by the tests)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt

      - name: Compile every module
        run: python -m compileall -q api.py app.py main.py backend core_engine evaluator narrative_runtime utils tests

      - name: Run the test suite (one process per module, in parallel)
        run: |
          # Saves, records and artifacts go to temporary folders (tests/records_sandbox.py).
          export ANE_SAVE_DIR="$RUNNER_TEMP/ane-saves"
          mkdir -p "$ANE_SAVE_DIR" test-logs
          ls tests/test_*.py | sed 's#tests/##; s#\.py$##' > test-modules.txt
          echo "$(wc -l < test-modules.txt) test modules"
          status=0
          xargs -P "$(nproc)" -I{} sh -c \
            'if python -m unittest tests.{} > test-logs/{}.log 2>&1; then echo "passed  {}"; else echo "FAILED  {}"; exit 1; fi' \
            < test-modules.txt || status=1
          for log in test-logs/*.log; do
            echo "::group::$(basename "$log" .log): $(grep -E '^(OK|FAILED)' "$log" | tail -n 1)"
            tail -n 60 "$log"
            echo "::endgroup::"
          done
          exit $status

      - name: Keep the test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: test-logs/
          retention-days: 7

  docker:
    name: Docker image (API and studio)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Make room for the image (PyTorch with CUDA, about 10 GB)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune --all --force
          df -h /

      - name: Provide what compose.yaml expects from the host
        run: |
          # An external network shared with other services, and a records folder the
          # container user (uid 10001) can write to.
          docker network create hamlet-shared-network
          mkdir -p "$RUNNER_TEMP/ane-records"
          chmod 0777 "$RUNNER_TEMP/ane-records"
          echo "ANE_RECORDS_HOST_DIR=$RUNNER_TEMP/ane-records" >> "$GITHUB_ENV"

      - name: Check compose.yaml
        run: docker compose config --quiet

      - name: Build the image (both services run it)
        run: docker compose build --progress plain

      - name: Start the API and the studio (waits for their health checks)
        run: docker compose up --detach --wait --wait-timeout 600

      - name: Smoke-test the API and the studio
        run: python3 .github/scripts/docker_smoke_test.py --api http://127.0.0.1:8004 --ui http://127.0.0.1:8003

      - name: Check that a story was recorded
        run: |
          find "$RUNNER_TEMP/ane-records" -maxdepth 2 | head -n 20
          test -n "$(find "$RUNNER_TEMP/ane-records" -type f | head -n 1)"

      - name: Services and their logs
        if: always()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail 300

      - name: Stop the services
        if: always()
        run: docker compose down --volumes --remove-orphans
