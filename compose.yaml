name: hamlet-ane

x-api-volumes: &api-volumes
  - ${ANE_CONFIG_VOLUME:-narrative-config}:/app/config
  - narrative-artifacts:/app/artifacts
  - narrative-saves:/app/saves  # persistent variables across playthroughs
  - model-cache:/var/cache/huggingface
  # The records database (every run, world, engine and story) and engine model files.
  # The folder must be writable by the container user (uid 10001) to record; otherwise
  # recording switches itself off (GET /v1/records says why), the records already there are
  # still shown, and the studio and API keep working.
  - ${ANE_RECORDS_HOST_DIR:-/data/angelisg/ane}:/data/angelisg/ane

services:
  ui:
    build:
      context: .
    image: hamlet-ane:latest
    init: true
    command: ["python", "app.py"]
    ports:
      - "${ANE_UI_BIND_ADDRESS:-0.0.0.0}:${ANE_UI_PORT:-8003}:8003"
    environment:
      ANE_UI_HOST: 0.0.0.0
      ANE_UI_PORT: 8003
      ANE_UI_SHARE: ${ANE_UI_SHARE:-false}
      # The studio does everything through the API service over HTTP (one engine, one set of
      # sessions, runs and records); it never serves the API itself, so it needs none of the
      # API's volumes. ANE_STUDIO_API_URL points it at another API, e.g. the public deployment
      # http://ane.hamlet.iti.gr (empty: the api service below).
      ANE_API_URL: ${ANE_STUDIO_API_URL:-http://hamlet-ane-api:8005}
    depends_on:
      api:
        condition: service_healthy
    networks:
      hamlet-shared-network:
        aliases:
          - hamlet-ane-ui
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/gradio_api/startup-events')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  api:
    build:
      context: .
    image: hamlet-ane:latest
    init: true
    command: ["python", "-m", "uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8005", "--workers", "1", "--proxy-headers", "--forwarded-allow-ips=*"]
    ports:
      - "${ANE_API_BIND_ADDRESS:-0.0.0.0}:${ANE_API_PORT:-8005}:8005"
    environment:
      ANE_CORS_ORIGINS: ${ANE_CORS_ORIGINS:-}
      # Where this API is published (behind the reverse proxy to port 8005): listed in /docs.
      ANE_PUBLIC_URL: ${ANE_PUBLIC_URL-http://ane.hamlet.iti.gr}
      ANE_RECORDS_DIR: /data/angelisg/ane
      # Config entries (names) or settings (paths) edited in the volume that take this release's
      # defaults on the next start, or `all` (a backup is kept in .ane-backups/). Empty: keep them.
      ANE_CONFIG_TAKE_DEFAULTS: ${ANE_CONFIG_TAKE_DEFAULTS:-}
      # The language model judge (Gemma 4 on a vLLM server): the `judge` service below when it
      # runs. Another OpenAI-compatible vLLM server works too; empty: vllm.* in the engine logic.
      ANE_JUDGE_URL: ${ANE_JUDGE_URL-http://hamlet-ane-judge:8000/v1}
      # World augmentation's own language model (Qwen3.5-4B on a vLLM server): the `augmenter`
      # service below when it runs; empty: augmentation.llm.* in the engine logic.
      ANE_AUGMENT_URL: ${ANE_AUGMENT_URL-http://hamlet-ane-augmenter:8000/v1}
      # The judge and the augmenter take turns on one GPU (on); off when each has a GPU of its own.
      ANE_LLM_SHARING: ${ANE_LLM_SHARING:-on}
    volumes: *api-volumes
    networks:
      hamlet-shared-network:
        aliases:
          - hamlet-ane-api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # The language model judge, off unless asked for (it takes a GPU):
  #   docker compose --profile judge up -d judge
  # Gemma 4 E4B served by vLLM from a local Hugging Face cache (offline: the model must be in it).
  # It takes turns with the augmenter on one GPU (sleep mode: the one not running waits in CPU memory;
  # the API wakes the one it needs). Several sessions: give each its own GPU and ANE_LLM_SHARING=off.
  judge:
    profiles: [judge]
    image: ${ANE_JUDGE_IMAGE:-hamlet-cpcg-vllm:0.20.2-gemma4-turing}
    user: "${ANE_JUDGE_USER:-1004:1004}"   # the owner of the model cache
    entrypoint: ["python3", "/ane/vllm_turn_start.py"]   # the augmenter put to sleep, then `vllm serve`
    command:
      - --model=${ANE_JUDGE_MODEL:-google/gemma-4-E4B-it}
      - --served-model-name=${ANE_JUDGE_MODEL:-google/gemma-4-E4B-it}
      - --dtype=float16
      - --max-model-len=8192
      - --gpu-memory-utilization=${ANE_JUDGE_GPU_MEMORY:-0.72}   # fits beside the augmenter asleep
      - --max-num-seqs=8
      - --enable-sleep-mode
      - --enforce-eager
      - --api-key=${ANE_JUDGE_API_KEY:-local-vllm}
      - '--limit-mm-per-prompt={"image":0,"audio":0}'
    environment:
      HOME: /tmp
      USER: ane
      LOGNAME: ane
      HF_HOME: /hf
      HF_HUB_OFFLINE: "1"
      VLLM_CACHE_ROOT: /tmp/vllm
      TORCHINDUCTOR_CACHE_DIR: /tmp/inductor
      VLLM_SERVER_DEV_MODE: "1"            # /sleep and /wake_up (internal network only: not published)
      ANE_LLM_SHARING: ${ANE_LLM_SHARING:-on}
      ANE_LLM_PEERS: http://hamlet-ane-augmenter:8000
      ANE_LLM_PEER_API_KEY: ${ANE_AUGMENT_API_KEY:-local-vllm}
    volumes:
      - ${ANE_JUDGE_HF_CACHE:-/home/angelisg/.cache/huggingface}:/hf
      - ./packaging/vllm_turn_start.py:/ane/vllm_turn_start.py:ro
    shm_size: 4g
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${ANE_JUDGE_GPU:-0}"]   # the augmenter's GPU: they take turns
              capabilities: [gpu]
    networks:
      hamlet-shared-network:
        aliases:
          - hamlet-ane-judge
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 600s

  # World augmentation's language model, off unless asked for (it takes a GPU):
  #   docker compose --profile augmenter up -d augmenter
  # It takes turns with the judge on one GPU (sleep mode), as the judge's comment says.
  # Qwen3.5-4B (float16, not quantized) served by vLLM from a local folder of its weights
  # (ANE_AUGMENT_MODELS/Qwen3.5-4B, downloaded with `hf download Qwen/Qwen3.5-4B --local-dir ...`).
  augmenter:
    profiles: [augmenter]
    image: ${ANE_AUGMENT_IMAGE:-hamlet-cpcg-vllm:0.20.2-gemma4-turing}   # vLLM 0.20.2: Qwen3.5 included
    user: "${ANE_AUGMENT_USER:-1004:1004}"   # the owner of the model folder
    entrypoint: ["python3", "/ane/vllm_turn_start.py"]   # the judge put to sleep, then `vllm serve`
    command:
      - --model=/models/${ANE_AUGMENT_MODEL_DIR:-Qwen3.5-4B}
      - --served-model-name=${ANE_AUGMENT_MODEL:-Qwen/Qwen3.5-4B}
      - --dtype=float16                      # TITAN RTX (Turing): no bfloat16
      - --max-model-len=8192
      - --gpu-memory-utilization=${ANE_AUGMENT_GPU_MEMORY:-0.6}   # fits beside the judge asleep
      - --max-num-seqs=4
      - --enable-sleep-mode
      - --enforce-eager
      - --api-key=${ANE_AUGMENT_API_KEY:-local-vllm}
      - '--limit-mm-per-prompt={"image":0,"video":0}'   # text only
    environment:
      HOME: /tmp
      USER: ane
      LOGNAME: ane
      HF_HUB_OFFLINE: "1"
      VLLM_CACHE_ROOT: /tmp/vllm
      TORCHINDUCTOR_CACHE_DIR: /tmp/inductor
      VLLM_SERVER_DEV_MODE: "1"            # /sleep and /wake_up (internal network only: not published)
      ANE_LLM_SHARING: ${ANE_LLM_SHARING:-on}
      ANE_LLM_PEERS: http://hamlet-ane-judge:8000
      ANE_LLM_PEER_API_KEY: ${ANE_JUDGE_API_KEY:-local-vllm}
      # Started together with the judge: wait for it to serve (it loads first), then put it to sleep.
      ANE_LLM_WAIT_FOR_PEERS: ${ANE_LLM_WAIT_FOR_PEERS:-900}
    volumes:
      - ${ANE_AUGMENT_MODELS:-/data/angelisg/llm_models}:/models:ro
      - ./packaging/vllm_turn_start.py:/ane/vllm_turn_start.py:ro
    shm_size: 4g
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${ANE_AUGMENT_GPU:-0}"]
              capabilities: [gpu]
    networks:
      hamlet-shared-network:
        aliases:
          - hamlet-ane-augmenter
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 600s

volumes:
  narrative-config:
  narrative-artifacts:
  narrative-saves:
  model-cache:

networks:
  hamlet-shared-network:
    external: true