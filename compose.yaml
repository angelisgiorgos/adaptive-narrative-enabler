name: hamlet-ane

x-studio-volumes: &studio-volumes
  - ${ANE_CONFIG_VOLUME:-narrative-config}:/app/config
  - narrative-artifacts:/app/artifacts
  - narrative-saves:/app/saves  # persistent variables across playthroughs
  - model-cache:/var/cache/huggingface
  # The records database (every run, world, engine and story) and engine model files.
  # The folder must be writable by the container user (uid 10001); otherwise recording
  # switches itself off and the studio and API keep working.
  - ${ANE_RECORDS_HOST_DIR:-/data/angelisg/ane}:/data/angelisg/ane

services:
  ui:
    build:
      context: .
    image: hamlet-ane:latest
    init: true
    command: ["python", "app.py"]
    ports:
      - "${ANE_UI_BIND_ADDRESS:-0.0.0.0}:${ANE_UI_PORT:-8003}:8003"
    environment:
      ANE_UI_HOST: 0.0.0.0
      ANE_UI_PORT: 8003
      ANE_UI_SHARE: ${ANE_UI_SHARE:-false}
      # The studio does everything through the API service (one engine, one set of
      # sessions, runs and records). ANE_STUDIO_API_URL= (empty) serves the API
      # inside the studio instead.
      ANE_API_URL: ${ANE_STUDIO_API_URL-http://hamlet-ane-api:8004}
      ANE_RECORDS_DIR: /data/angelisg/ane
    depends_on:
      api:
        condition: service_healthy
    volumes: *studio-volumes
    networks:
      hamlet-shared-network:
        aliases:
          - hamlet-ane-ui
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/gradio_api/startup-events')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  api:
    build:
      context: .
    image: hamlet-ane:latest
    init: true
    command: ["python", "-m", "uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8004", "--workers", "1", "--proxy-headers", "--forwarded-allow-ips=*"]
    ports:
      - "${ANE_API_BIND_ADDRESS:-0.0.0.0}:${ANE_API_PORT:-8004}:8004"
    environment:
      ANE_CORS_ORIGINS: ${ANE_CORS_ORIGINS:-}
      ANE_RECORDS_DIR: /data/angelisg/ane
    volumes: *studio-volumes
    networks:
      hamlet-shared-network:
        aliases:
          - hamlet-ane-api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  narrative-config:
  narrative-artifacts:
  narrative-saves:
  model-cache:

networks:
  hamlet-shared-network:
    external: true