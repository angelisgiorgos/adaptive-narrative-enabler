# Missions are the story's win conditions. When a story starts, one mission is
# chosen at random (weighted by `weight`, default 1). When its goal is achieved,
# the player wins and the story ends (see mission_settings in hyperparameters).
#
# A goal combines one or more conditions; ALL of them must hold:
#   action:       an action was taken successfully. Match its full name
#                 ("(Priest) Seek a blessing") or its name without the
#                 "(NPC) " / "[Item] " prefix ("Seek a blessing").
#   location:     the player has reached this location.
#   item:         this item is in the inventory.
#   event:        this event was entered and resolved (whatever the result).
#   event_succeeded: this event was resolved by an event action that succeeded
#                 (a failed action or stepping away does not count).
#   npc_removed:  this NPC was removed from the story (outcome `remove_npc`).
#   outcome_tag:  an outcome with this tag succeeded (e.g. escape).
#   coins:        the player holds at least this many coins.
#   variables:    persistent variables, e.g. {reputation: {gte: 1}}.
#   condition:    any condition tree (all / any / not, variable, stat,
#                 resource, has_item, visited, ...); see docs/WORLD.md.
# Missions whose goal already holds at the start of the story are never chosen.
# `rewards` is an effect list applied when the mission is completed.
world_definition:
  missions:
    expose_the_fence:
      enabled_if: {thief_caught: false, fence_exposed: false}
      title: Expose the fence
      description: Find out who buys the goods stolen at the market.
      stages:                      # a quest in steps, completed in order
      - title: Find out who buys the stolen goods
        description: Corner the market thief and make them talk, or win the merchant's trust until they let it slip.
        goal:
          condition:
            any:
            - {action_done: Interrogate the thief}
            - {secret_known: Merchant}
      - title: Find the fence's ledger
        description: The thief named someone in the Sewers; their ledger is the proof.
        goal: {item: Fence's Ledger}
    break_into_the_vault:
      title: Break into the Vault
      description: Find a way past the guards, into the Vault, and crack its main safe.
      stages:
      - title: Get into the Vault
        description: Find a way past the guards.
        goal: {location: Vault}
      - title: Crack the main safe
        description: Whatever the city whispers about lies inside it.
        goal: {action: Crack the main safe}
    shield_bearer:
      title: Find a shield
      description: Get hold of a heavy shield before the real trouble starts.
      goal:
        item: Heavy Shield
    royal_audience:
      title: Buy your way into the Palace
      description: Reach the Palace with at least 20 coins to your name.
      stages:
      - title: Raise 20 coins
        description: Nobody enters the Palace with an empty purse.
        goal: {coins: 20}
      - title: Reach the Palace
        description: Bring the coins to the Palace gates.
        goal: {location: Palace, coins: 20}
    rid_the_market_of_the_thief:
      enabled_if: {thief_caught: false}
      title: Rid the market of the thief
      description: Drive the thief out of the market for good.
      stages:
      - title: Pick up the thief's trail
        description: The captain of the watch pays a bounty; the merchants and the guards know who robs them.
        goal:
          condition:
            any:
            - {action_done: Take the bounty on the market thief}
            - {action_done: Ask about the market thief}
            - {action_done: Report the market thief}
      - title: Catch the thief in the act
        description: Patched cloak, quick fingers, the spice stalls at dusk. Mind their lookout.
        goal: {event: confront_thief}
        rewards:
        - change_coins: 3
      - title: Drive the thief out for good
        description: Beat them, hand them to the watch, or make them lead you to their hideout.
        goal: {npc_removed: Thief}
      rewards:                     # the merchants are grateful
      - change_variable: {reputation: 1}
      - change_coins: 10
    free_the_smuggler:
      title: The smuggler's tunnels
      description: A smuggler in the Dungeon knows a way under every wall. Get him out, and he will show you.
      stages:
      - title: Get yourself thrown in the Dungeon
        description: The only way in is in irons. Insult a guard to his face.
        goal: {action: Insult the guard to his face}
      - title: Free the smuggler
        description: Bribe the jailer, pick the lock, or fight your way out, and take him with you.
        goal: {outcome_tag: smuggler_freed}
      - title: Follow his tunnels to the Vault
        description: His tunnels come up under the Vault.
        goal: {location: Vault}
      rewards:
      - change_coins: 15
    champion_of_the_back_room:
      enabled_if: {pit_champion: false}
      title: Champion of the back room
      description: The Tavern's back room has an undefeated champion. Earn the right to fight her, then beat her.
      stages:
      - title: Win a brawl in the Tavern's back room
        description: Trade blows in the back room, or fight dirty; the Pit Champion is watching.
        goal: {outcome_tag: brawl_won}
        rewards:
        - change_coins: 2
      - title: Beat the Pit Champion
        description: Challenge her in the Tavern. Toe to toe, or wear her down. Throwing the fight does not count.
        goal: {outcome_tag: champion_beaten}
      rewards:
      - change_variable: {reputation: 1}
    a_face_for_the_palace:
      title: A face for the Palace
      description: The Maskwright can make you anyone. Wear a palace official's face and find out who pays for the masks.
      stages:
      - title: Commission a mask from the Maskwright
        description: The Maskwright sells faces at the Festival of Masks and the Market of the Ancients.
        goal: {item: "Official's Mask"}
      - title: Walk into the Palace
        description: Gate guards salute a palace face.
        goal: {location: Palace}
      - title: Unmask the festival's patron
        description: Someone who walks the Palace and its gardens pays for every mask.
        goal: {action: "Unmask her as the festival's patron"}
      rewards:
      - change_coins: 12
      - change_variable: {reputation: 1}
    clear_your_name:
      title: Clear your name
      description: Your reputation precedes you. Earn back the city's trust.
      enabled_if: {reputation: {lt: 0}}   # offered only to travelers with a bad name
      goal:
        variables: {reputation: {gte: 1}}
