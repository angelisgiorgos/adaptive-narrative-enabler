world_definition:
  characters:
  - name: Priest
    unique: true
    associated_tags: [religion, abandoned, social, discovery]
    known_locations: [Abandoned Church, Palace]
    known_objects: [Vintage Wine]
    goals:
    - Save souls
    - Heal the sick
    descriptions:
    - He's always helping lost souls.
    - He's always worrying about saving others.
    - He's got a good heart looking out for others.
    - A true believer.
    # What he says when you talk with him: the first line whose enabled_if
    # holds (any condition), otherwise his usual words.
    dialogue:
    - enabled_if: {reputation: {gte: 2}}
      text: The whole city speaks well of you, child. Walk in peace.
    - enabled_if:
        any:
        - {variable: reputation, op: lt, value: 0}
        - {has_item: "Fence's Ledger"}
      text: I hear troubling things about you. My door is open, should you wish to make amends.
    actions:
    - name: Seek a blessing
      outcomes:
      - desc: The priest offers a prayer that restores your spirit.
        health_change: 2
        change_variables: {reputation: 1}
        change_stats: {persuasion: 5}   # blessed words carry weight
        tags:
        - neutral
      - desc: He offers to lead you to a quiet place of prayer.
        lead_to_known: true
        tags:
        - social
  - name: Gate Guard
    unique: false
    associated_tags: [guarded, urban, palace, vault, dungeon]
    known_locations: [Vault, Dungeon, Palace]
    known_objects: [Heavy Shield, Gold Coins]
    goals:
    - Maintain order
    - Collect bribes
    descriptions:
    - A tired-looking guard leaning on a pike.
    - He looks like he'd rather be anywhere else but here.
    - He's always watching for troublemakers with a cynical eye.
    - He's secretly hoping for a quiet shift so he can nap.
    secret:
      text: "{npc} admits under his breath that he owes money to the wrong people; that is why he takes bribes."
      talks: 2
    actions:
    - id: gate_guard_settle_debt
      name: Offer to settle the guard's debt quietly
      exclusive_group: get_past_gate_guard
      enabled_if: {all: [{secret_known: Gate Guard}, {not: {at_location: Vault}}]}
      required_coins: 8
      outcomes:
      - desc: Relief floods his face; he pockets the coins and shows you the way in.
        tags: [social, success]
        lead_to_known: true
        linked_location: Vault
    - id: gate_guard_give_drink
      name: Give him the {alcohol_desc}
      # One way past the guard: once any of these succeeds, the others disappear.
      exclusive_group: get_past_gate_guard
      enabled_if: {not: {any: [{at_location: Vault}, {at_location: Palace}]}}   # it gets you into the Palace: not from inside
      required_tag: alcohol
      consumes_object: true
      outcomes:
      - id: gate_guard_bribe_pass
        desc: The guard takes the bottle with a wink, lets you pass, and nods at a shield left by the barracks.
        tags:
        - neutral
        - success
        reveal_object: Heavy Shield
        lead_to_known: true
        linked_location: Palace
      - id: gate_guard_drunk_sluggish
        desc: He drinks the whole thing, gets sluggish, and forgets your face.
        tags:
        - stealth
        health_change: 1
    # No coin bribe at the gates: a guard on duty is bribed only in the Dungeon (the jailer, to
    # open a cell or free a prisoner who knows the way; see the Dungeon and the Smuggler).
    - id: gate_guard_show_mask
      name: Show him your official's face
      exclusive_group: get_past_gate_guard
      enabled_if: {not: {any: [{at_location: Vault}, {at_location: Palace}]}}   # it gets you into the Palace
      required_object: Official's Mask
      outcomes:
      - id: gate_guard_salutes_mask
        desc: He snaps to attention at the sight of a palace official and waves you through.
        tags: [social, deception, success]
        lead_to_known: true
        linked_location: Palace
    - id: gate_guard_approach
      name: Approach the guard
      repeat: always
      outcomes:
      - id: gate_guard_friendly
        desc: The guard is unexpectedly friendly and gives you directions.
        variants:
        - "The guard recognises you and nods you on, a little warier than before."
        - "The guard sighs, 'You again,' and points the way without looking up."
        tags:
        - neutral
      - id: gate_guard_rude
        desc: The guard is incredibly rude and pushes you back.
        health_change: -1
        tags:
        - threat
        - failure
      - id: gate_guard_debt_secret
        desc: The guard whispers for help; he's trapped in a debt he can't pay.
        tags:
        - setup_clue
    - id: gate_guard_fight
      name: Fight the guard
      exclusive_group: get_past_gate_guard
      enabled_if: {not: {any: [{at_location: Vault}, {at_location: Palace}]}}   # it forces your way into the Palace
      required_tag: weapon
      consumes_object: false
      outcomes:
      - id: gate_guard_fight_win
        desc: You overpower the guard and force your way inside!
        change_variables: {reputation: -2}
        tags:
        - combat
        - success
        move_to: Palace
      - id: gate_guard_fight_lose
        desc: The guard is stronger than he looks; you take a heavy blow before retreating.
        tags:
        - combat
        - threat
        - failure
        health_change: -3
  - name: Bandit
    unique: false
    # Hostile: ambushes the player on every visit to a location where a bandit lurks.
    encounter_event: bandit_ambush
    encounter_repeat: true
    associated_tags: [dark, alley, threat, urban, discovery]
    known_locations: [Sewers, Alley]     # bandits lurk in dark streets, not in guarded places
    known_objects: [Steel Dagger, Ancient Map]
    goals:
    - Rob travelers
    - Survive the streets
    descriptions:
    - A hooded figure with a scarred face and a jagged blade.
    - They move with the predatory grace of someone who has lived in the shadows too
      long.
    - A desperate-looking thief with hungry eyes.
    - He stalks the alleyways, looking for an easy mark.
    actions: []  # the confrontation lives in events.yaml (bandit_ambush)
  - name: Dock Worker
    unique: false
    associated_tags:
    - harbor
    - dockworkers
    - port
    goals:
    - Earn a living
    - Avoid the storm
    descriptions:
    - A burly man covered in salt and sweat.
    - He has a rough voice from years of shouting over the crashing waves.
    - He moves with a weary but steady strength, hauling crates older than himself.
    - His eyes are constantly fixed on the horizon, searching for a ship that never
      arrives.
    actions:
    - name: Speak to the dockworker
      outcomes:
      - desc: They offer to show you a shortcut to a nearby hub.
        lead_to_known: true
        tags:
        - social
      - desc: They offer the traveler wine.
        tags:
        - neutral
        health_change: 1
  - name: Aurora
    unique: true
    article: ""          # a proper name: "Met Aurora"
    associated_tags:
    - palace
    - luxury
    goals:
    - Seek the truth
    - Protect the legacy
    known_locations: [Palace, Secret Garden]
    descriptions:
    - A mysterious figure draped in flowing silk and secrets.
    - She speaks in melodic riddles that seem to vibrate in the air.
    - She carries the faint scent of jasmine and ancient parchment.
    - Her presence is both haunting and regal, as if she belongs to another era.
    actions:
    dialogue:
    - enabled_if: {action_done: Unmask her as the festival's patron}
      text: Aurora smiles behind her fan. "One masked friend recognises another. The Vault's back door is yours."
    - enabled_if: {has_item: "Official's Mask"}
      text: Aurora studies your borrowed face a moment too long. "That is not the face you were born with."
    actions:
    - name: Ask about the crown
      repeat: once                                # what she knows, she tells once
      until: {action_done: Crack the main safe}   # once the safe is open, the secret is out
      outcomes:
      - desc: She cryptically mentions it's hidden in the Vault.
        tags:
        - spawn
        spawn: true
    - name: Unmask her as the festival's patron
      repeat: once
      retry_on_failure: true   # seen through once, the mask can still convince her another time
      enabled_if: {has_item: "Official's Mask"}   # only another mask can name the patron of masks
      skill_check: {stat: persuasion}
      outcomes:
      - desc: Behind your borrowed face you name her the patron of the festival; she laughs, and trusts you with the Vault's back door.
        on_check: pass
        tags: [social, deception, success]
        reveal_location: Vault
        change_variables: {reputation: 1}
      - desc: She sees through your mask at once and calls for the guards.
        on_check: fail
        tags: [guards, threat, failure]
  - name: Gardener
    unique: true
    associated_tags:
    - nature
    - serene
    - hidden
    - secret_garden
    goals: [Keep the garden alive, Keep Aurora's secrets]
    known_locations: [Secret Garden, Palace]
    descriptions:
    - An old gardener with soil under his nails and a pruning knife in his belt.
    - He hums to the roses as if they could answer.
    actions:
    - name: Help tend the roses
      repeat: once
      outcomes:
      - desc: You work the beds beside him; he promises to tell the city of your kindness.
        tags: [social, nature, success]
        health_change: 1
        change_variables: {reputation: 1}
    - name: Ask about Aurora's visits
      repeat: once
      outcomes:
      - desc: He lowers his voice. Aurora slips into the Palace by the garden door at dusk.
        tags: [social, discovery]
        reveal_location: Palace
  - name: Guard
    unique: false
    associated_tags:
    - prison
    - palace
    - dungeon
    - protect
    goals: [Keep the peace, Finish the shift]
    known_locations: [Dungeon, Palace, Market]
    descriptions:
    - A city guard in a dented helmet, one hand resting on a cudgel.
    - The guard eyes you, deciding whether you are trouble.
    actions:
    - name: Report the market thief
      repeat: once
      enabled_if: {thief_caught: false}
      outcomes:
      - desc: The guard notes it down and thanks you; word of your honesty gets around.
        tags: [social, success]
        change_variables: {reputation: 1}
    - name: Insult the guard to his face
      # The only way into the Dungeon is in irons; out again without the smuggler, try again.
      enabled_if: {all: [{mission: free_the_smuggler}, {not: {outcome_tag: smuggler_freed}}]}
      outcomes:
      - desc: You call him a coward in front of his sergeant. Two minutes later you are in irons.
        tags: [guards, threat, arrest]
        send_to: Dungeon
    - name: Ask about the prisoners
      repeat: once
      outcomes:
      - desc: He grumbles that a smuggler in the Dungeon talks about tunnels under the Sewers.
        tags: [social, discovery]
        reveal_location: Sewers
  - name: Merchant
    unique: false
    associated_tags:   # hawker: calls out to a new face (npc_behaviour)
    - commercial
    - market
    - buy
    - sell
    - guidance
    - information
    - hawker
    known_locations: [Market, Market of the Ancients, Festival of Masks]
    known_objects: [Ancient Map, Vintage Wine, Gold Coins]
    descriptions:
    - A many-ringed dealer who prices every object in coins, favors, and secrets.
    secret:                    # comes out after two dealings with them ([SECRET]; enabled_if: {secret_known: Merchant})
      text: "{npc} lets it slip: the goods the market thief steals are sold on in the Sewers, to a fence who keeps a ledger."
      talks: 2
      effects:
      - reveal_location: Sewers
      - set_variable: {fence_exposed: true}   # now the ledger can be found
    dialogue:
    - enabled_if: {npc_removed: Thief}
      text: The merchant presses a fig into your hand. "Since the thief is gone, I sleep at night. On the house."
    - enabled_if: {thief_caught: true}
      text: '"No thief in my market since you came through last time. The stalls still talk about it."'
    actions:
    - name: Ask about the market thief
      repeat: once
      enabled_if: {not: {npc_removed: Thief}}
      outcomes:
      - desc: '"Patched cloak, quick fingers, works the spice stalls at dusk. And mind the boy with the cudgel: he watches for them."'
        tags: [social, setup_clue, thief_trail]
        reveal_npc: Thief
    - name: Threaten to expose the merchant's trade
      repeat: once
      enabled_if: {secret_known: Merchant}
      skill_check: {stat: persuasion}
      outcomes:
      - desc: The merchant pales and pays for your silence.
        on_check: pass
        tags: [social, success, risk]
        coin_change: 6
      - desc: The merchant shouts for the guards before you can finish.
        on_check: fail
        tags: [guards, threat, failure]
    - name: Ask about forbidden merchandise
      outcomes:
      - desc: The merchant produces a map whose coastline changes whenever you blink.
        tags: [social, discovery, setup_clue]
        reveal_object: Ancient Map
      - desc: The merchant loudly accuses you of theft to distract the guards.
        tags: [unexpected, threat, guards]
        coin_change: -3
  - name: Storm Cartographer
    unique: true
    associated_tags: [science, storm, arcane, heights, discovery]
    known_locations: [Storm Observatory, Drowned Archive, Harbor]
    known_objects: [Ancient Map]
    goals: [Map the storm's interior, Find the vanished island]
    descriptions:
    - A rain-soaked scholar tattoos new coastlines onto their arms as the weather changes.
    actions:
    - name: Compare maps of the storm
      repeat: once
      outcomes:
      - desc: The cartographer identifies a safe current leading to the Drowned Archive.
        tags: [social, success, discovery]
        reveal_location: Drowned Archive
        lead_to_known: true
      - desc: Both maps redraw themselves to place you at the center of the storm.
        tags: [unexpected, setup_clue, arcane]
  - name: Exiled Archivist
    unique: true
    associated_tags: [ancient, underwater, mystery, social, discovery]
    known_locations: [Drowned Archive, Bone Orchard, Vault]
    known_objects: [Ancient Map, Gold Coins]
    goals: [Restore the erased history, Expose the false royal lineage]
    descriptions:
    - Their robes are stitched from waterproof pages covered in censored names.
    actions:
    - name: Request the forbidden chapter
      repeat: once
      retry_on_failure: true   # the erased sentence can be asked for again
      outcomes:
      - desc: The archivist reveals that the orchard remembers every royal betrayal.
        tags: [social, setup_clue, discovery]
        reveal_location: Bone Orchard
      - desc: The chapter erases the last sentence spoken aloud.
        tags: [unexpected, arcane, failure]
        health_change: -1
  - name: Memory Thief
    unique: true
    # Remembers you from futures that never happened: only from the second playthrough on.
    enabled_if: {playthroughs: {gte: 1}}
    # Hostile: confronts the player the first time they meet.
    encounter_event: memory_theft
    associated_tags: [eerie, ancient, stealth, threat, underground, discovery]
    known_locations: [Bone Orchard, Ghostline Station, Alley]
    known_objects: [Steel Dagger]
    goals: [Steal a royal memory, Escape their own forgotten identity]
    descriptions:
    - A figure with mirrored eyes who remembers meeting you in futures that never happened.
    actions: []  # the confrontation lives in events.yaml (memory_theft)
  - name: Pale Conductor
    unique: true
    associated_tags: [spectral, travel, industrial, underground, social, apparition]   # apparition: seen once
    known_locations: [Ghostline Station, Palace, Harbor]
    known_objects: [Vintage Wine, Gold Coins]
    goals: [Keep the impossible timetable, Find one living passenger]
    descriptions:
    - A translucent conductor checks a watch whose hands move in opposite directions.
    actions:
    - name: Ask for a destination not on the map
      outcomes:
      - desc: The conductor punches a ticket to the palace's forgotten platform.
        tags: [voyage, success, unexpected]
        move_to: Palace
      - desc: The conductor says your destination was demolished tomorrow.
        tags: [setup_clue, spectral]
        reveal_location: Storm Observatory
  - name: Maskwright
    unique: true
    associated_tags: [social, deception, celebration, masks, arcane]
    known_locations: [Festival of Masks, Palace, Market of the Ancients]
    known_objects: [Heavy Shield, Vintage Wine]
    goals: [Craft the face of a perfect ruler, Unmask the festival patron]
    descriptions:
    - The artisan wears a blank porcelain face and speaks through nearby masks.
    dialogue:
    - enabled_if: {has_item: "Official's Mask"}
      text: The blank porcelain face tilts. "It suits you. Gate guards salute it; a certain lady in the Palace will not."
    - text: "Every face in this city was made by someone. For six coins, I make you a palace official's."
    actions:
    - name: Commission a new identity
      repeat: once              # one face per traveler
      required_coins: 6
      outcomes:
      - desc: For six coins the maskwright shapes you the face of a minor palace official, still warm from the kiln.
        tags: [social, deception, success]
        effects:
        - give_item: Official's Mask
    - name: Ask who pays for the festival
      repeat: once
      outcomes:
      - desc: '"A patron in the Palace gardens, who wears no mask by day." The maskwright says no more.'
        tags: [social, setup_clue, deception]
        reveal_npc: Aurora
        reveal_location: Secret Garden
  - name: Runaway Apprentice
    unique: true
    associated_tags: [urban, science, social, discovery, threat, wanderer]   # wanderer: met in two visits at most
    known_locations: [Storm Observatory, Sewers, Market]
    known_objects: [Ancient Map, Rusty Sword]
    goals: [Undo a disastrous experiment, Avoid the cartographer]
    descriptions:
    - A soot-covered teenager carries a jar containing a tiny, furious thundercloud.
    actions:
    - name: Help contain the bottled storm
      repeat: once
      retry_on_failure: true   # a storm that escaped can be caught again
      outcomes:
      - desc: The cloud calms and illuminates a hidden route through the sewers.
        tags: [success, discovery, social]
        reveal_location: Sewers
      - desc: Lightning escapes the jar and animates every metal object nearby.
        tags: [unexpected, threat, science, failure]
        health_change: -1
  - name: Thief
    unique: true
    enabled_if: {thief_caught: false}   # beaten once, gone in later playthroughs
    associated_tags: [market, trade, urban, stealth, threat]
    known_locations: [Market]
    known_objects: [Gold Coins]
    goals:
    - Lift a purse without being seen
    - Sell stolen goods in the sewers
    descriptions:
    - A wiry figure drifts between the stalls, fingers never far from other people's purses.
    - Someone in a patched cloak watches the crowd a little too carefully.
    dialogue:
    - enabled_if: {event_done: lookout_ambush}
      text: The thief's smile slips. "You hurt my lookout. That was a mistake."
    - text: '"Lost something, friend? Markets are full of thieves. I would know."'
    actions:
    - name: Confront the thief
      triggers_event: confront_thief

  # ---- the thief's hunt, the Dungeon's prisoner, the Sewers' fence, the Tavern's pit ----------
  - name: Captain of the Watch
    unique: true
    article: the
    associated_tags: [market, trade, guard, law, protect, quest_giver]   # quest_giver: comes up to you (npc_behaviour)
    known_locations: [Market, Palace]
    goals:
    - goal: Rid the market of its thief
      tags: [thief_gone]
      needed: 1
      reward: lead
    - Keep the peace
    descriptions:
    - A broad-shouldered captain with a scarred lip and a ledger of every crime in the city.
    - The captain counts the market's losses on scarred fingers and runs out of fingers.
    dialogue:
    - enabled_if: {npc_removed: Thief}
      text: '"The market breathes again. Come to me if you ever want a badge."'
    - enabled_if: {reputation: {lt: 0}}
      text: '"I know your face from the reports. Tread carefully in my market."'
    - text: '"A thief works my market and I have not the men to catch them. Find them, and the bounty is yours."'
    actions:
    - name: Take the bounty on the market thief
      repeat: once
      enabled_if: {not: {npc_removed: Thief}}
      outcomes:
      - desc: The captain presses a warrant into your hand. "The merchants know more than they tell me. Mind the thief's lookouts."
        tags: [social, success, thief_trail]
        coin_change: 5
    - name: Claim the bounty on the thief
      repeat: once
      enabled_if: {npc_removed: Thief}
      outcomes:
      - desc: The captain counts out the bounty in front of the whole market. "Rid of them at last. The watch owes you one."
        tags: [social, success, thief_gone]
        coin_change: 12
        change_variables: {reputation: 1}
  - name: Thief's Lookout
    unique: false
    # Hostile: once you hunt the thief, their lookout comes for you (once a story).
    enabled_if:
      all:
      - {thief_caught: false}
      - {not: {npc_removed: Thief}}
      - any:
        - {action_done: Take the bounty on the market thief}
        - {action_done: Ask about the market thief}
        - {action_done: Report the market thief}
    encounter_event: lookout_ambush
    associated_tags: [market, alley, stealth, threat]
    known_locations: [Market, Alley]
    goals: [Warn the thief, Earn a cut]
    descriptions:
    - A boy with a cudgel and an old man's eyes, who never looks at the stalls, only at you.
    actions: []  # the confrontation lives in events.yaml (lookout_ambush)
  - name: Smuggler
    unique: true
    article: the
    # A prisoner in the Dungeon: freed (a bribe, a lock, a fight), he leads the way toward your quest.
    associated_tags: [prisoner, prison, smuggling, tunnels, underground]   # prisoner: calls you over (npc_behaviour)
    known_locations: [Dungeon, Sewers, Vault, Market]
    known_objects: [Fence's Ledger]
    goals:
    - goal: Get out of this cell
      tags: [smuggler_freed]
      needed: 1
      reward: lead
    - Settle the score with the fence
    descriptions:
    - A gaunt man with tar-black fingernails, who maps the city by the sound of water under it.
    - He taps the wall in a rhythm only tunnel-diggers know.
    dialogue:
    - enabled_if: {fence_exposed: true}
      text: '"The fence? I sold to him for years. His ledger is in the Sewers. Get me out and I will take you."'
    - text: '"Get me out of here, and I know a way under every wall in this city: the Vault, the market, the fence''s den."'
    actions:
    - name: Bribe the jailer to open both cells
      required_coins: 10
      skill_check: {stat: persuasion}
      outcomes:
      - desc: 'The jailer counts your coins twice, then turns his key in two locks. The smuggler grins: "This way. I know where you need to go."'
        on_check: pass
        tags: [escape, social, success, smuggler_freed]
        change_variables: {reputation: -1}
        lead_to_known: true
      - desc: The jailer pockets the coins and turns his back. "Bribing a jailer? That is another week for you."
        on_check: fail
        tags: [guards, failure]
    - name: Pick the lock of his cell
      skill_check: {stat: stealth}
      outcomes:
      - desc: A bent nail, three clicks, and the smuggler is beside you, pointing at a loose drain. "After me."
        on_check: pass
        tags: [escape, stealth, success, smuggler_freed]
        lead_to_known: true
      - desc: The nail snaps in the lock; the jailer's lantern swings your way.
        on_check: fail
        tags: [threat, failure]
        health_change: -1
    - name: Overpower the jailer
      skill_check: {stat: attack}
      outcomes:
      - desc: One blow and the jailer drops his keys; the smuggler is out before they stop ringing. "This way, quick!"
        on_check: pass
        tags: [escape, combat, success, smuggler_freed]
        change_variables: {reputation: -1}
        lead_to_known: true
      - desc: The jailer is bigger than he looked; he beats you back against the bars.
        on_check: fail
        tags: [combat, threat, failure]
        health_change: -3
  - name: Fence
    unique: true
    article: the
    associated_tags: [underground, smuggling, foul, labyrinthine, threat]
    known_locations: [Sewers]
    known_objects: [Fence's Ledger]
    goals: [Keep the ledger hidden, Buy cheap and sell dear]
    descriptions:
    - A soft-voiced dealer on a throne of stolen crates, guarded by a man the size of a door.
    - The fence weighs every visitor like a purse.
    dialogue:
    - enabled_if: {fence_exposed: true}
      text: '"So the little thief talked. Then you know what my ledger is worth, and what it will cost you."'
    - text: '"Buying or selling? If neither, the tunnels are long and nobody counts the bodies."'
    actions:
    - name: Demand the fence's ledger
      repeat: once
      enabled_if: {fence_exposed: true}   # the ledger exists once the thief has named its keeper
      triggers_event: fence_showdown
      outcomes:
      - desc: The fence sighs and snaps his fingers; his bodyguard steps out of the dark.
        tags: [threat, confrontation]
  - name: Pit Champion
    unique: true
    article: the
    associated_tags: [noisy, brawl, fight, champion, information, challenger]   # challenger: sizes you up on every visit
    known_locations: [Tavern]
    goals: [Find a worthy opponent, Keep the title]
    descriptions:
    - A mountain of a woman with knuckles like walnuts, undefeated in the Tavern's back room.
    - The champion cracks her neck and grins at everyone who walks in.
    dialogue:
    - enabled_if: {pit_champion: true}
      text: '"You again. The back room still talks about the night you beat me."'
    - enabled_if: {outcome_tag: brawl_won}
      text: '"I saw that. Not bad. Now try someone who hits back."'
    - text: '"Win a brawl in the back room first. Then we talk."'
    actions:
    - name: Ask for a bout in the back room
      triggers_event: tavern_brawl
      outcomes:
      - desc: The champion jerks a thumb at the back room. "Show me in there first."
        tags: [combat, brawl]
    - name: Challenge the champion
