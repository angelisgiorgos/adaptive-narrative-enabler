# Items. A generic item (the default) is shown wherever its tags fit, so each
# location can hold its own copy; the player holds at most one, and a used one
# can be found again. A unique item exists once per story:
#     unique: true
#     location: Sewers      # where its one instance lies (default: the location
#                           # its tags fit best); shown only there, gone from the
#                           # world once collected, and gone for good once used.
world_definition:
  objects:
  - name: Ancient Map
    associated_tags:
    - urban
    - alley
    interact_prompts:
    - Examine the map
    - Study the faded markings
    goals:
    - Discovery
    - Navigation
    descriptions:
    - A brittle, yellowed map showing secret city tunnels.
    - The ink is faded, but you can see a route to the Palace.
    actions:
    - id: ancient_map_study
      name: Study the map
      repeat: once  # a map only reveals its secrets once
      outcomes:
      - id: ancient_map_route_to_palace
        desc: The traveler discovers a hidden route to the Palace.
        tags:
        - spawn
        spawn: true
        linked_location: Palace
  - name: Vintage Wine
    stat_bonus: {persuasion: 5}   # a fine gift opens doors
    collectible: true
    associated_tags:
    - social
    - urban
    - alcohol
    interact_prompts:
    - Grab the bottle
    - Pick up the wine
    goals:
    - Collection
    - Bribe
    descriptions:
    - A dusty bottle of vintage red wine.
    - The labeling is in a prestigious script; a perfect bribe.
    actions:
    - id: vintage_wine_collect
      name: Collect the wine
      collects_object: Vintage Wine
      outcomes:
      - id: vintage_wine_collect_success
        desc: The traveler pockets a bottle of fine wine.
        tags:
        - stealth
  - name: Steel Dagger
    stat_bonus: {attack: 15}
    collectible: true
    associated_tags:
    - urban
    - alley
    - weapon
    - combat
    - fight
    interact_prompts:
    - Pick up the dagger
    - Arm yourself
    goals:
    - Self-defense
    - Combat
    descriptions:
    - A sharp, well-balanced steel blade.
    - The edge is keen and ready for a fight.
    actions:
    - name: Collect the dagger
      collects_object: Steel Dagger
      outcomes:
      - desc: The traveler arms themselves with the steel dagger.
        tags:
        - neutral
        - success
  - name: Heavy Shield
    stat_bonus: {defence: 20}
    collectible: true
    associated_tags:
    - guarded
    - palace
    - defense
    - combat
    interact_prompts:
    - Take the shield
    - Heave the shield onto your arm
    goals:
    - Protection
    descriptions:
    - A sturdy oak shield reinforced with iron bands.
    - It's heavy, but it offers excellent protection.
    actions:
    - name: Collect the shield
      collects_object: Heavy Shield
      outcomes:
      - desc: The traveler takes up the heavy shield.
        tags:
        - neutral
        - success
  - name: Gold Coins
    collectible: false
    associated_tags:
    - trade
    - poverty
    descriptions:
    - A few clinking gold coins.
    - Hard currency for hard places.
  - name: Antique Statue
    associated_tags:
    - nature
  - name: Rusty Sword
    stat_bonus: {attack: 5}
    associated_tags:
    - damp
  - name: Fence's Ledger
    stat_bonus: {persuasion: 10}  # leverage
    # Only exists once the thief has confessed who buys the stolen goods.
    enabled_if: {fence_exposed: true}
    # One ledger in the whole story, lying in the Sewers: its tags alone would
    # also fit the Bone Orchard and the Ghostline Station.
    unique: true
    location: Sewers
    collectible: true
    associated_tags: [underground, foul]
    descriptions:
    - A water-stained ledger listing every stolen treasure and who paid for it.
    actions:
    - name: Read the ledger
      outcomes:
      - desc: One buyer appears on every page, with a key to a strongroom in the Vault.
        tags: [discovery, payoff_1]
        reveal_location: Vault
        change_variables: {reputation: 1}
    - name: Take the ledger
      collects_object: Fence's Ledger
      outcomes:
      - desc: You tuck the ledger under your cloak. Someone will pay dearly for it.
        tags: [neutral, success]
