# Events are self-contained situations entered by taking an action that declares
# `triggers_event: <event id>` (on a location, NPC, or item action).
#
# While an event is active, only its actions are available: no travel, NPC,
# item, or conversation actions, and no NPCs or items spawn. Choosing any event
# action ends the event and returns the player to the location where it began,
# unless the outcome moves them (move_to, move_to_tags, lead_to_known).
#
# An NPC can also start an event by itself: give it `encounter_event: <event id>`
# in npcs.yaml and the event starts as soon as the NPC is present in the scene,
# before the player can do anything else (including leave). It happens once per
# game, or on every visit to a location with `encounter_repeat: true`.
#
# Event-specific fields:
#   title                 Name shown while the event is active.
#   descriptions          Text shown when the event starts (one is picked).
#   tags                  Added to the narrative tags of every event outcome.
#   actions[].triggers_event
#                         Chain into another event after a successful choice.
#   outcomes[].remove_npc true removes the NPC who triggered the event; a name
#                         removes that NPC. A removed unique NPC never
#                         reappears; a generic one only leaves this visit.
#   actions[].repeat / exclusive_group
#                         How often an option is offered, and one-choice groups
#                         (see "Repeatable and one-time options" in docs/WORLD.md).
# Actions and outcomes otherwise use the same fields as location actions.
#
# When an event may start. These rules hold for every way into it (trigger
# actions, encounters, chains, start_event effects, the random schedule); while
# they block it, its trigger actions are not offered and its encounters wait:
#   enabled_if            A condition that must hold.
#   repeat                once (unique in the story) | per_location | per_visit
#                         | always (default).
#   max_occurrences       At most this many times per story.
#   cooldown              Turns after it ended before it can start again.
#   trigger               action (default): something in the story starts it.
#                         random: it may also start by itself; each turn it can
#                         start, it does with probability `chance`, and `weight`
#                         picks between random events that hit together, e.g.
#                           trigger: random
#                           chance: 0.15
#                           enabled_if: {at_location: Market}
#                           cooldown: 6
world_definition:
  events:
    confront_thief:
      title: Confronting the thief
      tags: [threat, market, confrontation]
      descriptions:
      - You grab the thief by the collar before they can slip into the crowd.
      - The thief freezes as you block the only gap between two stalls.
      actions:
      - name: Fight the thief
        outcomes:
        - desc: A short scuffle ends with the thief fleeing empty-handed, leaving a purse behind.
          tags: [combat, success, thief_gone]
          coin_change: 10
          remove_npc: true
          set_variables: {thief_caught: true}     # the thief stays gone in later playthroughs
          change_variables: {reputation: -1}
        - desc: The thief lands a quick jab and slips back into the crowd, still working the market.
          tags: [combat, threat, failure]
          health_change: -2
      - name: Interrogate the thief
        skill_check: {stat: persuasion, modifier: 0}     # a cornered thief can be made to talk
        outcomes:
        - desc: Cornered, the thief admits they sell stolen goods to someone in the sewers.
          on_check: pass
          tags: [social, setup_clue]
          reveal_location: Sewers
          set_variables: {fence_exposed: true}
        - desc: In exchange for their freedom, the thief leads you down to their hideout in the sewers.
          on_check: pass
          tags: [social, discovery]
          move_to: Sewers
          remove_npc: true
          set_variables: {fence_exposed: true}
        - desc: The thief laughs in your face and slips your grip, but you will find them in the market again.
          variants:
          - "The thief twists free again, quicker this time, and blows you a kiss from the crowd."
          - "Gone again: only a torn strip of the thief's cloak is left in your hand."
          on_check: fail
          tags: [social, failure]
      - name: Hand the thief over to the watch
        enabled_if: {action_done: Take the bounty on the market thief}   # with the captain's warrant
        skill_check: {stat: persuasion}
        outcomes:
        - desc: You wave the captain's warrant; two guards march the thief off in irons, the market cheering.
          on_check: pass
          tags: [social, success, thief_gone]
          remove_npc: true
          set_variables: {thief_caught: true}
          change_variables: {reputation: 1}
        - desc: The guards squint at the warrant, and the thief is gone while they argue over the seal.
          on_check: fail
          tags: [social, failure]
      - name: Steal from the thief
        outcomes:
        - desc: While they protest their innocence, you lift a stolen pouch from their belt.
          tags: [stealth, success]
          coin_change: 15
          change_variables: {reputation: -1}
        - desc: A market guard sees you rummaging through the thief's pockets and drives you both off.
          tags: [stealth, threat, failure]
          health_change: -1
          move_to: Alley
    bandit_ambush:
      title: Ambushed by a bandit
      cooldown: 8         # bandits lurk on every visit, but not on every turn...
      max_occurrences: 3  # ...and not all story long (a fourth ambush is padding)
      tags: [threat, ambush]
      descriptions:
      - A hooded figure steps out of the shadows, blade first. "Your purse or your life."
      - A jagged knife presses against your ribs before you even hear footsteps.
      actions:
      - name: Fight for your life
        required_tag: weapon
        outcomes:
        - desc: With a swift strike, you drive the bandit away.
          tags: [combat, success]
          remove_npc: true
        - desc: The bandit is skilled; they leave you bleeding in the gutter.
          tags: [combat, threat, failure]
          health_change: -4
      - name: Hand over your coins
        outcomes:
        - desc: The bandit snatches your purse, counts it with a sneer, and lets slip that the fence in the Sewers pays better than you do.
          tags: [threat, setup_clue]
          coin_change: -10
          remove_npc: true
      - name: Plead for mercy
        outcomes:
        - desc: They take your coins and leave you bruised but alive, with a warning that the guards below the Vault are paid to look away.
          tags: [threat, setup_clue]
          coin_change: -20
          health_change: -1
          remove_npc: true
        - desc: The bandit has no mercy; they strike you down where you stand.
          tags: [threat]
          health_change: -5
      - name: Make a run for it
        skill_check: {stat: stealth}
        outcomes:
        - desc: You duck under the blade and run back the way you came.
          on_check: pass
          tags: [stealth, success]
          return_to_previous: true   # fleeing takes you back where you came from
        - desc: The bandit catches your cloak and slashes before you break free.
          on_check: fail
          tags: [threat, failure]
          health_change: -2
    guards_alerted:
      title: The guards come running
      repeat: always   # any alarm, any botched bribe can bring them...
      cooldown: 4      # ...but not turn after turn
      # complication: it may follow a failed attempt that otherwise led nowhere (director.fail_forward)
      tags: [threat, guards, complication]
      descriptions:
      - Boots pound closer and lanterns swing toward you.
      - A whistle shrills somewhere close; the guards are coming, and they are not alone.
      actions:
      - name: Hide in the shadows
        skill_check: {stat: stealth}
        outcomes:
        - desc: The guards sweep past your hiding place, cursing whoever raised the alarm.
          on_check: pass
          tags: [stealth, success]
        - desc: A lantern finds your face. "There!" Rough hands drag you away.
          on_check: fail
          tags: [guards, failure]
          send_to: Dungeon
      - name: Bluff that you have every right to be here
        skill_check: {stat: persuasion}
        outcomes:
        - desc: "\"The magistrate sent me,\" you say; the sergeant hesitates, then waves you on, embarrassed."
          on_check: pass
          tags: [social, success]
        - desc: The sergeant laughs and calls for irons.
          on_check: fail
          tags: [guards, failure]
          send_to: Dungeon
      - name: Slip away down a drain into the Sewers
        outcomes:
        - desc: You squeeze through a grate just as the first lantern turns the corner.
          tags: [stealth, success]
          move_to: Sewers
    memory_theft:
      title: The Memory Thief strikes
      repeat: once    # unique: whatever starts it, it happens once per story
      tags: [spectral, threat]
      descriptions:
      - Mirrored eyes find yours, and a memory you have not made yet starts to slip away.
      actions:
      - name: Defend your memories
        outcomes:
        - desc: You trap the thief inside a borrowed recollection.
          tags: [combat, success, payoff_2]
          remove_npc: true
        - desc: The thief steals the memory of how you arrived here.
          tags: [threat, failure, unexpected]
          health_change: -2
      - name: Offer a false memory
        outcomes:
        - desc: The forgery satisfies the thief, who reveals the ghostline entrance.
          tags: [stealth, social, success]
          reveal_location: Ghostline Station
    lookout_ambush:
      title: The thief's lookout
      repeat: once
      tags: [threat, ambush, market]
      descriptions:
      - A boy with a cudgel and an old man's eyes blocks your way. "You ask too many questions about my friend."
      - Someone shoves you hard into a stall. "Stop looking for the patched cloak, or you will not see anything again."
      actions:
      - name: Fight the lookout
        skill_check: {stat: attack}
        outcomes:
        - desc: The lookout goes down hard; in his pocket, a chalk map of the market with the spice stalls circled.
          on_check: pass
          tags: [combat, success, setup_clue]
          remove_npc: true
        - desc: He is quicker than he looks; a cudgel to the ribs, and he runs to warn the thief.
          on_check: fail
          tags: [combat, threat, failure]
          health_change: -2
          remove_npc: true
      - name: Pay him to sell out the thief
        required_coins: 5
        skill_check: {stat: persuasion}
        outcomes:
        - desc: Five coins and a promise of no questions; he tells you the thief works the spice stalls at dusk.
          on_check: pass
          tags: [social, success, setup_clue]
          remove_npc: true
        - desc: He bites the coin, pockets it, and whistles; the crowd closes around you.
          on_check: fail
          tags: [threat, failure]
          health_change: -1
          remove_npc: true
      - name: Slip away into the crowd
        skill_check: {stat: stealth}
        outcomes:
        - desc: You duck under an awning and he loses you, cursing.
          on_check: pass
          tags: [stealth, success]
          remove_npc: true
        - desc: He catches your sleeve; the cudgel finds your shoulder before you break free.
          on_check: fail
          tags: [threat, failure]
          health_change: -1
          remove_npc: true
    fence_showdown:
      title: The fence's bodyguard
      repeat: once
      tags: [threat, underground, confrontation]
      descriptions:
      - The bodyguard cracks his knuckles. The fence does not look up from his ledger. "Make it quick."
      actions:
      - name: Fight the bodyguard
        skill_check: {stat: attack, modifier: -10}   # a big man in a narrow tunnel
        outcomes:
        - desc: The bodyguard topples into the water; the fence slides his ledger across the crates without a word.
          on_check: pass
          tags: [combat, success, payoff_clue]
          reveal_object: "Fence's Ledger"
        - desc: The bodyguard throws you into the sewer channel; you crawl out half-drowned.
          on_check: fail
          tags: [combat, threat, failure]
          health_change: -3
      - name: Name the thief who sold him out
        enabled_if: {fence_exposed: true}
        skill_check: {stat: persuasion}
        outcomes:
        - desc: At the thief's name the fence goes pale; he would rather lose a ledger than his customers.
          on_check: pass
          tags: [social, success, payoff_clue]
          reveal_object: "Fence's Ledger"
        - desc: '"The thief lies for a living," the fence smiles, and the bodyguard shows you out.'
          on_check: fail
          tags: [social, failure]
          return_to_previous: true
      - name: Buy the ledger
        required_coins: 15
        outcomes:
        - desc: Fifteen coins later, the ledger is yours. The fence is already counting.
          tags: [neutral, success]
          reveal_object: "Fence's Ledger"
    tavern_brawl:
      title: A brawl in the back room
      cooldown: 3
      max_occurrences: 4
      tags: [combat, brawl, social]
      descriptions:
      - Tables are pushed back; a sailor with one ear wants to know if you can take a punch.
      - The back room roars as someone shoves you into the ring.
      actions:
      - name: Trade blows
        skill_check: {stat: attack}
        outcomes:
        - desc: A clean right hook and your opponent sits down hard; the room pays up.
          on_check: pass
          tags: [combat, success, brawl_won]
          coin_change: 6
        - desc: You eat a fist and the floorboards; someone pours beer on you to wake you up.
          on_check: fail
          tags: [combat, threat, failure]
          health_change: -2
      - name: Fight dirty
        skill_check: {stat: stealth}
        outcomes:
        - desc: A chair leg where nobody was looking; you win, and nobody likes you for it.
          on_check: pass
          tags: [combat, stealth, success, brawl_won]
          coin_change: 8
          change_variables: {reputation: -1}
        - desc: Caught with the chair leg; the whole room joins in against you.
          on_check: fail
          tags: [combat, threat, failure]
          health_change: -2
      - name: Bow out and buy a round
        outcomes:
        - desc: You buy the room a round instead; the sailor clinks your mug. "Next time."
          tags: [social, neutral]
          coin_change: -2
    champion_bout:
      title: The champion's bout
      max_occurrences: 2   # a beaten challenger gets one rematch...
      cooldown: 5          # ...once the bruises have had time
      tags: [combat, brawl, champion]
      descriptions:
      - The champion rolls her shoulders. The room goes quiet enough to hear the bets change hands.
      actions:
      - name: Stand toe to toe
        skill_check: {stat: attack, modifier: -10}   # she has never lost
        outcomes:
        - desc: Blow for blow until her knees give; the back room has a new champion.
          on_check: pass
          tags: [combat, success, champion_beaten]
          coin_change: 20
          change_stats: {attack: 5}
          set_variables: {pit_champion: true}
        - desc: She is everything they said; you wake up on a table with your purse lighter.
          on_check: fail
          tags: [combat, threat, failure]
          health_change: -3
      - name: Wear her down
        skill_check: {stat: defence}
        outcomes:
        - desc: You take everything she throws until she has nothing left to throw; one push, and she falls.
          on_check: pass
          tags: [combat, success, champion_beaten]
          coin_change: 15
          change_stats: {defence: 5}
          set_variables: {pit_champion: true}
        - desc: Your guard breaks before her arms tire; the crowd groans and pays the other side.
          on_check: fail
          tags: [combat, threat, failure]
          health_change: -2
      - name: Throw the fight for a cut
        outcomes:
        - desc: You go down in the third round, as agreed; the bookmaker slips you twelve coins and a wink.
          tags: [deception, thrown_fight]   # not a failure: the bout is lost on purpose
          coin_change: 12
          change_variables: {reputation: -1}
