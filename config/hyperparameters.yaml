evolution:
  pop_size: 400
  generations: 200
  episodes_per_genome: 6
  max_steps: 100             # steps per evaluated story (narrative_end.max_actions: whole stories)
  evaluation_threads: auto
  max_evaluation_processes: 16
  parallel_backend: processes
  mutation_rate: 0.22
  mutation_step: 0.14
  elitism_rate: 0.08
  crossover_rate: 0.75
  blend_crossover_chance: 0.55
  random_immigrant_rate: 0.08
  min_diversity: 0.08         # below this population diversity, more immigrants and wider mutation
  max_immigrant_rate: 0.3     # ...up to this share of random newcomers per generation
  tournament_size: 3          # parents are the best of this many random genomes
  max_mutation_step: 0.4      # adaptive mutation widens up to this when learning stalls...
  stagnation_generations: 3   # ...after this many generations without improvement
  early_stop_generations: 0   # stop after this many generations without improvement (0: never)
  warm_start: true            # start from the best genomes remembered from earlier runs
  hall_of_fame_size: 12       # how many genomes the learning memory keeps
  validation_episodes: 10     # fixed benchmark stories that score each generation's champion
  cover_situations: true      # the benchmark has at least one story per start x mission situation
  benchmark_top_k: 3          # this many of each generation's best are benchmarked; the champion is the
                              # best of them on the benchmark, not the luckiest on the training stories
  # How storytellers are evaluated (README, "How the evolutionary AI learns"):
  full_length_stories: true   # every story is played to its end, as in a real game
  stratify_episodes: true     # every storyteller plays the same spread of start x mission situations
  score_aggregate: mean_minus_std  # mean | mean_minus_std: consistent storytellers beat erratic ones
  consistency_weight: 0.25    # mean_minus_std: score = mean - this x standard deviation of the episodes
story_rules:
  # Rules that keep stories coherent, paced and varied (core_engine/rules.py).
  failure_tags: [failure]     # these outcomes are told only when the attempt fails (as on_check: fail)
  follow_outcome_text: true   # a route an outcome or an NPC lead opens is the place its text names
  early_goal_avoidance: 1.0   # x mission_goal_weight: hold back from the mission until pursuit_start_step
  on_stall: move              # move: after max_consecutive_steps_in_location, move on; end: end the story
  repetition_power: 1.5       # repeating a choice costs uses ** power (x novelty_bias)
  backtrack_penalty: 1.5      # going straight back to the place just left (x novelty_bias)
  tie_epsilon: 0.1            # choices this close to the best are ordered by story logic, not by name
  collect_weight: 1.0         # picking up an item not held (x discovery_bias; useful items x1.5)
  payoff_weight: 2.0          # an action that pays off an open clue (x setup_prob)
  payoff_route_weight: 1.5    # travelling to where an open clue can be paid off (x setup_prob)
  max_open_clues: 2           # while this many clues are open, no new clue is pursued
  clue_matching: any          # any: a payoff closes the oldest open clue; numbered: payoff_N closes setup_N
simulation:
  verbose: true
  interactive: true
  mutation_rate: 0.2
reproducibility:
  deterministic: true
  seed: 42
genome_bounds:
  threat_prob:
  - 0.1
  - 0.5
  spawn_prob:
  - 0.25
  - 0.75
  setup_prob:
  - 0.1
  - 0.45
  success_bias:
  - 0.5
  - 0.9
  guard_bias:
  - 0.1
  - 0.5
  voyage_bias:
  - 0.45
  - 0.9
  discovery_bias:
  - 0.3
  - 0.9
  recovery_bias:
  - 0.2
  - 0.8
  lead_bias:
  - 0.3
  - 0.9
  event_prob:
  - 0.08
  - 0.4
  chaos_bias:
  - 0.1
  - 0.75
  goal_bias:
  - 0.3
  - 1.0
  novelty_bias:
  - 0.2
  - 0.9
game_state:
  initial_health: 8
  max_health: 10      # healing never raises health above this
  arrest_location: Dungeon  # where losing to guards sends the player (one way)
  initial_coins: 10
  low_health_threshold: 4
  auto_transfer_when_stuck: true
  # Follow a newly found path when the genome's commitment score reaches this
  # threshold (deterministic: no dice roll).
  auto_travel_on_spawn: true
  auto_travel_on_spawn_threshold: 1.5
  auto_travel_commit_threshold: 1.2
  commit_discovery_weight: 0.4   # following a new path: x genome.discovery_bias
  commit_revisit_penalty: 0.6    # ... minus this per earlier visit
transition_objective:
  story_phases:                # which destinations suit the opening, middle and climax
    intro_end: 0.3
    climax_start: 0.75
    intro_tags: [exploration, urban, maritime, trade, nature]
    middle_tags: [threat, social, dark, guarded, discovery]
    climax_tags: [palace, vault, luxury, payoff, success]
  intent_similarity_weight: 4.0
  exact_intent_weight: 2.0
  novelty_weight: 2.0
  available_action_weight: 0.2
  revisit_penalty: 2.5
  story_phase_weight: 0.8
  voyage_weight: 1.0
  discovery_weight: 0.8
  character_goal_weight: 2.0
  known_location_bonus: 3.0
outcome_objective:
  success_threshold: 0.5
  health_weight: 1.5
  repetition_penalty: 1.5  # per earlier showing of the same outcome text (x genome.novelty_bias)
  coin_weight: 0.15
  success_probability_weight: 2.0
  discovery_weight: 2.0
  movement_weight: 2.5
  threat_interest_weight: 1.0
  low_health_risk_penalty: 3.0
  success_tag_bonus: 1.0
  setup_weight: 1.5
  payoff_weight: 2.0
narrative_end:
  max_actions: 100
  max_consecutive_steps_in_location: 5
  end_on_dungeon: false
scene:
  visibility:                  # which NPCs and items stand out in a scene
    npc_social_bias_weight: 1.0
    npc_threat_bias_weight: 0.5
    npc_urban_bias_weight: 0.25
    item_similarity_weight: 2.0
    item_urban_bias_weight: 0.4
    item_maritime_bias_weight: 0.4
    item_combat_bias_weight: 0.2
  max_visible_npcs: 3
  max_visible_objects: 2
  npc_similarity_threshold: 0.68
  npc_exact_tag_weight: 1.25
  npc_semantic_weight: 1.0
  npc_known_location_bonus: 3.0
  npc_generic_tag_weight: 0.05
  location_tag_match_bonus: 4.0
  location_npc_tags:
    Harbor: [harbor, maritime]
    Market: [market, commercial, trade]
    Palace: [palace, luxury, guarded]
    Dungeon: [dungeon, prison, guard, prisoner]
  generic_npc_tags:
  - urban
  - social
  - discovery
  - threat
  - success
  - neutral
location_constraints:
  Dungeon:
    requires_escape: true
    # sent: only a player SENT here (send_to, e.g. an arrest) is confined until an
    # escape; one who found a normal route may walk back. always: everyone.
    lock_when: sent
    entry: sent              # one only arrives here by being sent: never a travel option or a stop on the way
    escape_tags: [escape]
persistence:
  # Persistent variables (config/variables.yaml) are saved per player profile.
  path: saves/persistent_variables.json   # relative to the project, or absolute
  profile: default
  save_on: change          # change: save after every change; end: only when a story ends
  simulate_with: defaults  # evolution uses defaults (reproducible) or the stored values
mission_settings:
  enabled: true
  end_on_goal: true
  route_weight: 6.0
  discovery_route_cost: 2
  pursuit_start_step: 18       # goal pursuit starts here...
  pursuit_full_step: 40        # ...and is at full strength here (stories of about 28 turns)
start_selection:
  # Where each story starts: a weighted random draw among the locations with
  # `start_eligible: true` (weight: their `start_weight`) that are enabled and
  # from which the story's mission can be reached.
  default_location: Harbor  # the single start of worlds where no location is start_eligible
  recent_starts: 3          # how many of a profile's latest starts count as recent...
  repeat_factor: 0.25       # ...each one multiplies that location's weight by this (0 < f <= 1)
action_rules:
  # How often an action is offered unless it sets `repeat` itself:
  #   once (per game), per_visit (again on the next visit), always.
  default_repeat:
    location: per_visit
    npc: per_visit
    item: once
    event: always
authored_events:
  enabled: true
  fallback_action: Step away from the situation
  fallback_description: You step back and let the moment pass.
discovery_nodes:               # what an NPC's hint reveals: a place, a person or an item
  location_base: 0.3
  location_voyage_weight: 0.4
  npc_base: 0.2
  npc_social_weight: 0.3
  item_base: 0.2
  item_discovery_weight: 0.3
npc_leads:
  every_nth_interaction: 2     # NPCs share a lead on every n-th conversation (or a success)
  base_score: 1.0
  shared_tag_weight: 0.5
unexpected_events:
  objective:                   # how the engine picks the effect of an unexpected event
    low_health_healing_weight: 2.0
    healing_weight: 0.5
    coin_weight: 0.1
    low_health_threat_penalty: 2.0
  enabled: true
  base_chance: 0.08
  genome_weight: 0.3
  chaos_weight: 0.18
  objective_threshold: 0.24
  stagnation_pressure: 0.04
  cooldown_steps: 4           # turns between two procedural events
  max_per_story: 3
  coin_budget: 10             # coins all procedural events of a story may hand out together
  effect_repeat_penalty: 1.0  # each earlier use of an effect lowers its score: effects rotate
  name_location: true         # "In the Harbor, a bell rings backwards. ..."
  actors:
  - a masked courier
  - a runaway apprentice
  - an off-duty guard
  - a fortune teller
  - a wounded smuggler
  - a clockwork raven
  omens:
  - a bell rings backwards
  - every flame turns blue
  - a sudden fog swallows the street
  - the ground trembles beneath the city
  - a shower of torn wanted posters fills the air
  - distant music stops mid-note
  twists:
  - offers a dangerous bargain
  - names you as the subject of a prophecy
  - drops a key before vanishing
  - claims the city has changed rulers overnight
  - reveals that someone in your party is being followed
  - points toward a route that should not exist
  effects:
  - tags:
    - unexpected
    - social
    - setup_clue
  - tags:
    - unexpected
    - threat
    health_change: -1
  - tags:
    - unexpected
    - discovery
    - spawn
    spawn: true
  - tags:
    - unexpected
    - success
    coin_change: 8
  - tags:
    - unexpected
    - recovery
    health_change: 1
spawn_selection:
  story_phases:                # which newly discovered places suit each phase
    intro_end: 0.25
    climax_start: 0.75
    intro_tags: [exploration, urban, nature, spawn, maritime, port, trade]
    middle_tags: [threat, guards, social, sleazy, prison, dark, guarded]
    climax_tags: [palace, vault, grand, success, payoff, luxury]
    intro_weight: 1.5
    middle_weight: 1.75
    climax_weight: 2.0
  fallback_similarity_threshold: 0.2   # when no spawn rule applies: similar places only...
  fallback_candidates: 5               # ...and at most this many
  contrast_weight: 2.5
  character_alignment_weight: 2.0
  repeat_visit_penalty: 3.0
  immediate_repeat_penalty: 10.0
action_selection:
  base_weight: 0.15
  threat_weight: 1.0
  spawn_weight: 1.5
  setup_weight: 1.15
  discovery_weight: 1.3
  movement_weight: 1.5
  recovery_weight: 1.25
  stay_penalty_power: 2.2
  consistency_penalty_weight: 1.0
  event_trigger_weight: 1.5
  mission_goal_weight: 6.0
  repetition_penalty: 1.0  # per earlier use of the same choice (x genome.novelty_bias)
  skill_fit_weight: 2.0    # x (pass chance - 0.5) of an action's skill check
  heading_weight: 1.5      # a far place the story set out for: its next step on the map is favoured by this...
  heading_turns: 8         # ...for this many turns
  location_penalties:
    Dungeon:
      action_terms:
        royal halls: 12.0
      destination_tags:
        palace: 10.0
        luxury: 6.0
        grand: 4.0
outcome_scoring:
  spawn_bonus: 1.7
  movement_bonus: 1.7
  discovery_bonus: 1.4
  lead_bonus: 1.4
  recovery_bonus: 1.2
  setup_bonus: 1.1
  payoff_bonus: 1.2
outcome_resolution:
  probability_floor: 0.05      # success probabilities of unchecked outcomes stay in this range
  probability_ceiling: 0.95
  success_bias_weight: 0.3
  discovery_weight: 0.16
  lead_weight: 0.16
  voyage_weight: 0.18
  recovery_weight: 0.12
  low_health_recovery_bonus: 0.08
  stagnation_threshold: 2
  stagnation_movement_bonus: 0.1
  early_setup_bonus: 0.05
  severe_risk_penalty: 0.08
  navigation_floor: 0.98
  tag_weights:
    threat: -0.18
    spawn: 0.18
    social: 0.12
    stealth: 0.12
    urban: 0.08
    maritime: 0.08
    luxury: 0.08
    setup: 0.12
skill_check_resolution:
  # A check rolls 1..roll_sides and passes at or below:
  #   skill value + action modifier - difficulty_penalty - rate x (step - start step)
  roll_sides: 100
  difficulty_penalty: 0            # positive: every check harder; negative: easier
  difficulty_rate_per_step: 0.3    # per story step; positive: harder over time, negative: easier
  difficulty_rate_start_step: 15   # the change over time applies from this step
  min_chance: 5                    # pass chance never below this percentage...
  max_chance: 95                   # ...or above this one
  damage_mitigation_per_point: 25  # damage-reduction stat value per 1 combat damage prevented
  failure_mitigation_threshold: 80 # that stat's value at which a failed dangerous action costs no health
  failure_damage: 1                # health lost when an action fails...
  dangerous_failure_damage: 2      # ...and when a dangerous one (threats, combat, guards) fails
power_model:
  base_power: 0.0
  health_weight: 1.5
  stat_weight: 1.5        # x average skill value / 100
  low_health_penalty: 0.5
  min_power: 0.0
  max_power: 5.0
fitness:
  npc_interaction_cap: 3  # interactions per NPC that still add to the score (no reward for chat farming)
  variety:
    distinct_choice_weight: 30   # x share of choices that were distinct
    repeated_outcome_penalty: 2  # per outcome text shown again
  base:
    zero_step_penalty: -100
    death_penalty: 35
    completion_bonus: 10
    stall_penalty: 30
    dungeon_penalty: 10
    max_action_completion_bonus: 0   # reaching the action limit is not an ending...
    action_limit_penalty: 30         # ...a story cut off there is penalised (the director ends it with an epilogue)
    stage_bonus: 15                  # per stage of a staged mission completed
    mission_win_bonus: 80
    mission_win_min_steps: 25
    unfinished_penalty: 20     # a story cut by the evaluation length before its ending
  repetition:                  # losses for repetitive stories
    free_uses: 2               # an action may be taken this often before it costs
    action_repeat_penalty: 3   # per further use of the same action
    backtrack_penalty: 2       # per A -> B -> A travel loop
  pacing:
    early_win_penalty_per_step: 2  # per step a win comes before mission_win_min_steps
  length_normalization:        # these terms grow with every step
    enabled: true
    mode: rate                 # rate: counted per turn (x story_length.target); cap: only longer stories scaled down
    floor_steps: 20            # rate: a shorter story counts as this long, so a short story is not inflated
    terms: [dramatic_arc, scene_contrast, combat_success, volatility, character_interactions, discovery, tone_variety]
  engagement:                  # what a player feels turn by turn (from the story's turn log)
    filler_penalty: 60         # x share of turns that brought nothing new (no place, person, event, outcome, check, change)
    loop_window: 6             # an action repeated with the same outcome within this many turns...
    loop_penalty: 4            # ...costs this per turn
    novelty_fade_penalty: 50   # x drop of the share of new turns from the first to the last third
    escalation_bonus: 40       # x rise of tension (threats, damage, events) from the first to the last third
  dramatic_arc:
    intro_end: 0.25
    middle_end: 0.75
    intro_tags:
    - exploration
    - urban
    - nature
    - spawn
    - maritime
    - port
    - trade
    middle_tags:
    - threat
    - guards
    - social
    - sleazy
    - prison
    - dark
    - guarded
    climax_tags:
    - payoff_
    - palace
    - vault
    - grand
    - success
    - luxury
    intro_bonus: 2
    middle_bonus: 3
    climax_bonus: 5
  story_length:
    min: 20
    max: 60
    target: 35
    bonus: 25
    penalty_per_unit: 2
  threat_balance:
    min: 5
    max: 15
    target: 10
    bonus: 20
    penalty_per_unit: 2
  health_balance:
    min: 2
    max: 6
    target: 3
    bonus: 30
    penalty_per_unit: 4
  setup_payoff:
    target_count: 2
    pair_bonus: 15
    early_setup_bonus: 10
    late_payoff_bonus: 10
    clue_variants: 3
    min_gap_fraction: 0.33
    gap_step_bonus: 2
    short_gap_bonus: 5
    target_count_bonus: 2
    unmatched_setup_penalty: 4
    unmatched_payoff_penalty: 3
  volatility:
    pair_weight: 10
    threat_patterns:
    - threat
    - combat
    recovery_patterns:
    - neutral
    - success
  payoff_match_score: 10
  max_location_visits: 3
  visit_penalty: 5
  contrast_weight: 10
  volatility_pair_weight: 10
  tone_variety:
    density_weight: 30
    unique_tag_bonus: 1.5
    ignore_patterns:
    - spawn
    - failure
    - success
    - neutral
    - setup_
    - payoff_
  path_variety:
    unique_location_bonus: 6
    revisit_penalty: 2
    repeat_penalty_power: 2
    repeat_penalty_weight: 10
  character_interaction_bonus: 5
  character_spawn_bonus: 15
  npc_similarity_weight: 20
  npc_repeat_weight: 10
  combat_success_bonus: 25
  discovery:
    location_bonus: 4
    inventory_bonus: 2
    character_bonus: 3
  unexpected_events:
    target: 3
    variety_bonus: 6
    excess_penalty: 4
# The language model behind story evaluation, world augmentation and the editor's
# suggestions: one shared Gemma 4 runtime served by vLLM. `embedded` loads the model in
# this process (needs the `vllm` package and a GPU); `server` calls a separately started
# OpenAI-compatible server instead (`vllm serve google/gemma-4-E2B-it`), e.g. from Docker.
vllm:
  mode: embedded               # embedded | server
  model_name: google/gemma-4-E2B-it
  dtype: auto
  gpu_memory_utilization: 0.55
  max_model_len: 4096
  max_num_seqs: 1
  enforce_eager: true
  enable_prefix_caching: true
  limit_mm_per_prompt:         # text only: no image or audio inputs reserve memory
    image: 0
    audio: 0
  quantization: null
  cpu_offload_gb: 0
  trust_remote_code: false
  base_url: http://127.0.0.1:8000/v1   # server mode
  api_key: local-vllm                  # server mode
  timeout_seconds: 180                 # server mode
llm_evaluator:
  enabled: true
  max_new_tokens: 1024
  temperature: 0.3
config_editor:
  enabled: true
  show_story_browser_on_startup: true
  guided_mode: true
  show_json_path_examples: true
editor_suggester:
  enabled: true
  max_new_tokens: 256
  temperature: 0.7
world_definition:
  spawn_strategy: similarity
  similarity_threshold: 0.5
  story_map:                   # every story draws its own geography from the spawn rules:
    enabled: true
    neighbors: 3               # each place opens onto 3 of the places it fits (more fitting: more likely)
augmentation:
  enabled: true
  min_locations: 12
  min_items: 20
  min_npcs: 15
  min_outcomes: 60
  output_dir: augmentations
  save_to_source: true
director:                      # how a story builds over its course, like a game's director
  enabled: true
  escalation_start: 0.3        # story progress (share of narrative_end.max_actions) where escalation begins
  event_pressure: 0.6          # chance of unexpected events x (1 + this x escalation)
  threat_weight: 0.8           # the storyteller's pull toward threats x (1 + this x escalation)
  damage_scale: 1.25           # every health loss x this...
  damage_escalation: 0.6       # ...x (1 + this x escalation), rounded
  finale_actions: 15           # the finale starts this many actions before the action limit:
  finale_goal_pull: 1.0        # the mission pulls at full strength, and the story ends with an epilogue
  loop_window: 6               # an action used within this many turns whose outcomes were all shown is not offered
  min_options: 2               # ...unless fewer options would remain (one way to move on is enough)
  barred_turns: 5              # after a failed attempt, the engine does not carry the player where it led, for this long
  close_threads: true          # late in the story: open fewer new clues, pay off the open ones
  escape_bonus: 15             # each failed escape makes the next easier by this (skill check modifier)
  release_after: 5             # a prisoner still locked in after this many turns there is released
mission_selection:             # how a story's mission is drawn for a player profile
  recent_missions: 3           # the profile's latest missions...
  repeat_factor: 0.3           # ...are drawn this much less often, each time they appear
player_options:                # the choices a player sees (studio, API, offline engine)
  limit: 6                     # the most options shown at once
  min: 3                       # the fewest (when there are that many)
  relevance: 0.25              # beyond `min`, options ranked in the lowest quarter of those now are not shown...
  focus_relevance: 0.5         # ...in a tense moment the lower half (in between: in proportion; 0: none hidden)
  travel_limit: 3              # the most travel options at once: the best ways on
  talk_limit: 2                # the most "talk with" options at once
  focus_limit: 4               # tense moments (danger, a prisoner, the finale) show at most this many
  tense_tags: [threat, combat, guards, escape, failure]   # what in the last turn makes the moment tense
  relevance_filter: true       # false: simply the storyteller's best `limit` options
  order: world                 # world: in the scene's order (activities, people, items, travel); ranked: best first
