# Every sentence the engine writes into a story. Rewrite any of them.
#
# - Keep the {placeholders} you need; each entry lists the ones available.
#   Python format syntax works, e.g. {health:+d} shows +2 / -1.
# - A message can also be a list of variants. They are used in turn, so the
#   story does not repeat the same wording twice in a row (no random choice):
#       voyage:
#       - "You head towards the {location}."
#       - "The {location} beckons."
# - Remove an entry to use the built-in default. Unknown keys or placeholders
#   are rejected when saving from the studio or the API.
# - Option names (travel_new, travel_return, talk_action) must stay stable
#   within a turn; their variant is chosen from the location or NPC name.
messages:

  # --- Missions and endings
  mission_start: "[MISSION] {title}: {description}"  # {description}, {title}
  mission_start_brief: "[MISSION] {title}"  # {title}
  mission_complete: "[MISSION COMPLETE] {title}"  # {title}
  end_line: "[END] {reason}"  # {reason}
  end_death: "The traveler can no longer continue."
  end_mission: "Mission complete: {title}."  # {title}
  end_victory: "[EPILOGUE] {title}: done. {recap}"  # {title} {recap}: the road, the quest's steps, the friends made, the turns of fate (also {turns} {places} {people})
  end_action_limit: "The story reached its action limit of {limit} steps."  # {limit}
  end_epilogue: "[EPILOGUE] The day draws to a close after {turns} turns. {mission}{recap}"  # {turns} {mission} {recap} (also {places} {people} {items})
  epilogue_mission_open: "{title} is left for another day. "  # {title}
  finale_start: "[FINALE] Time is running out: {title} must be settled now."  # {title}
  stage_complete: "[QUEST] {done}: done. Next: {next}. {description}"  # {done} {next} {description}
  side_quest_start: "[SIDE QUEST] {title}: {description}"  # {title} {description} (its first step, or the quest's)
  side_quest_given: "[SIDE QUEST] {giver} asks a favour of you: {title}. {description}"  # {giver} {title} {description}
  side_quest_stage: "[SIDE QUEST] {title} - {done}: done. Next: {next}."  # {title} {done} {next}; also {description}
  side_quest_complete: "[SIDE QUEST COMPLETE] {title}"  # {title}
  side_quest_failed: "[SIDE QUEST FAILED] {title}"  # {title}
  side_quest_accepted: "[SIDE QUEST] You take it on: {title}."  # {title}
  side_quest_declined: "[SIDE QUEST] You turn it down: {title}."  # {title}
  side_quest_aid: "[LEAD] {title} pays off for your quest: the way to the {location} is open."  # {title} {location}
  side_quest_ally: "[ALLY] {npc} owes you for {title}, and will help with your quest."  # {npc} {title}
  side_quest_stakes: "[SIDE QUEST] In it for you: {reward}."  # {title} {reward}
  side_quest_helps: "[SIDE QUEST] It could help with your quest too: {mission}."  # {title} {mission}
  side_quest_deadline: "[SIDE QUEST] It has to be done within {turns} turns."  # {title} {turns}
  side_quest_ready: "[SIDE QUEST] {title}: done. Now take it back to {giver}."  # {title} {giver}
  side_quest_turned_in: "[SIDE QUEST] You hand it over to {giver}."  # {giver} {title}
  side_quest_expired: "[SIDE QUEST FAILED] {title}: too late."  # {title}
  side_quest_giver_gone: "[SIDE QUEST FAILED] {title}: {giver} is gone from the story."  # {title} {giver}
  side_quest_hurry: "[SIDE QUEST] Time is running out for {title}: {turns} turn(s) left."  # {title} {turns}
  side_quest_reminder: "[SIDE QUEST] Still open: {title} - {todo}."  # {title} {todo}
  side_quest_remind_ready: "[SIDE QUEST] {giver} is still waiting for you: {title}."  # {title} {giver}
  side_quest_way: "[LEAD] {source} points you the way to the {location}."  # {source} (the giver, or "What you heard") {location} {title}
  side_quest_item_gone: "[SIDE QUEST FAILED] {title}: {item} is gone for good."  # {title} {item}
  side_quest_epilogue: "[SIDE QUESTS] Along the way you {summary}."  # {summary}: saw ... through; failed at ...; left ... unfinished
  encounter_ambush: "[AMBUSH] {title}! In the {location}, they were waiting for you."  # {title} {location} {faction} {npc}
  encounter_hostile_patrol: "[PATROL] {title}: a patrol bars your way in the {location}."  # {title} {location} {faction} {npc}
  encounter_faction_attack: "[ATTACK] {faction} strike: {title}."  # {title} {location} {faction} {npc}
  encounter_npc_assault: "[ASSAULT] {npc} turns on you: {title}."  # {title} {location} {faction} {npc}
  encounter_location_raid: "[RAID] The {location} is under attack: {title}."  # {title} {location} {faction} {npc}
  encounter_environmental_threat: "[DANGER] {title}: the {location} itself turns against you."  # {title} {location} {faction} {npc}
  encounter_defensive_encounter: "[DEFEND] {title}: someone needs you to hold the line in the {location}."  # {title} {location} {faction} {npc}
  encounter_spared: "[SPARED] You go down, but not for good: {title} leaves you bruised, at 1 health."  # {title}: a dynamic encounter lost, the player spared (encounters.lethal: false)
  side_story_reveal: "[SIDE STORY] {title} turned up something about your quest: {text}"  # {title} {text}: the side quest's texts.reveal
  side_story_callback: "[CALLBACK] {title}: {text}"  # {title} {text}: a side quest's texts.callback, an encounter result's callback
  side_story_callback_ally: "[CALLBACK] {title}: {giver} has not forgotten what you did, and stands with you now."  # {title} {giver}
  side_story_callback_lead: "[CALLBACK] {title}: what you learned then shows you the way now."  # {title} {giver}
  finale_start_free: "[FINALE] Time is running out: the story nears its end."
  end_stalled: "The story stalled in {location} for too long."  # {location}
  end_dungeon: "The traveler was thrown into the {location}."  # {location}

  # --- Arriving and staying
  arrival: "\nYou are in the {location}. {description}"  # {description}, {location}
  arrival_npc: "Met {npc}: {description}"  # {description}, {npc}
  arrival_item: "Nearby you see {item}: {description}"  # {description}, {item}
  continue_here: "\nContinuing your activities in the {location}..."  # {location}

  # --- Choices and results
  action_taken: "> {action}"  # {action}
  result: "RESULT: {description}"  # {description}
  failure: "[FAILURE] {action} failed."  # {action}
  failure_arrest: "[FAILURE] The traveler lost the encounter and was dragged to the {location}."  # {action}, {location}

  # --- Travel (travel_new / travel_return are the names of travel options)
  travel_new: "Move to {location}"  # {location}
  travel_return: "Return to {location}"  # {location}
  travel_result: "You travel to {location}."  # {location}
  travel_first: "You set out for the {location}. {view}"  # {location}, {view}: what one sees on the way there (first time)
  location_current: "[LOCATION] Current location: {location}"  # {location}
  location_moved: "[LOCATION] Transferred from {origin} to {destination}"  # {destination}, {origin}
  location_stayed: "[LOCATION] Still at {location}"  # {location}
  auto_transfer: "[AUTO TRANSFER] No actions remained in {origin}, so a new route carried you to {destination}."  # {destination}, {origin}
  stall_move: "[MOVE ON] After lingering in the {origin}, you set out for the {destination}."  # {destination}, {origin}
  released: "[RELEASED] After a long wait the guards lose interest and let you out of the {origin}; you make for the {destination}."  # {origin} {destination}
  route_via: "[ROUTE] No road runs straight from the {origin} to the {destination}; you set out by way of the {via}."  # {origin}, {destination}, {via}
  lead_via: "[LEAD] The way to the {destination} runs through the {via}."  # {destination}, {via}
  spawn: "[SPAWN] New path discovered: {location}"  # {location}
  spawn_forced: "[SPAWN] A situational path opens to: {location}"  # {location}
  voyage: "[VOYAGE] The opening draws you toward {location}."  # {location}
  escape: "[ESCAPE] You found a way out of {location}."  # {location}
  exit_unlocked: "[UNLOCKED] The way out of the {location} is open now."  # {location}
  fled_back: "[BACK] You fall back the way you came, to the {location}."  # {location}
  sent: "[SENT] You are taken to the {location}. There is no way back the way you came."  # {location}

  # --- People and things (talk_action is the name of the conversation option)
  talk_action: "Talk with {npc}"  # {npc}
  approach_npc: "Approach {npc}"  # {npc}: the option that opens a conversation (conversations)
  leave_conversation: "Leave the conversation"  # {npc}: the option that closes it
  approached: "You approach {npc}."  # {npc}
  conversation_left: "You leave {npc} be."  # {npc}
  npc_approaches: "{npc_cap} comes up to you, wanting a word."  # {npc}, {npc_cap}: someone who starts the conversation
  look_around: "Look around"  # {location}: the option that leaves a place's own activities (location_behaviour)
  place_draws_in: "The {location} draws you in."  # {location}: a place that offers its own activities first
  looked_around: "You look around the {location}."  # {location}
  talk_default: "{npc} shares a few thoughts with you."  # {npc}
  talk_goal: " They speak about their goal: {goal}."  # {goal}, {npc}
  reveal_npc: "[DISCOVERY] You noticed {npc} in the scene."  # {npc}
  reveal_item: "[DISCOVERY] You spotted the {item} nearby."  # {item}
  lead_path: "[LEAD] {npc} told you about the way to: {location}"  # {location}, {npc}
  lead_move: "\n >>> [LEAD] {npc} led you to: {location}"  # {location}, {npc}
  npc_removed: "[NPC REMOVED] {npc} is no longer part of the story."  # {npc}
  npc_removed_scene: "[NPC REMOVED] {npc} leaves the {location}."  # {location}, {npc}
  encounter: "[ENCOUNTER] {npc} confronts you!"  # {npc}
  npc_goal_done: "[ALLY] You helped {npc} {goal}; they count you a friend now."  # {npc}, {goal}
  twist_payoff: "[TWIST] {text}"  # {text}: an earlier twist pays off
  callback: "[CALLBACK] It all fits: what you learned at the {place} pays off - \"{text}\""  # {place}, {text}, {turns}
  item_collected: "You collected the {item}."  # {item}
  item_used: "You have utilized the {item}."  # {item}
  paid: "[RESOURCES] Paid: {coins} coins (Balance: {balance})"  # {balance}, {coins}
  health_capped: "[HEALTH] Already at {health}/{max_health}; healing is capped at the maximum."  # {health}, {max_health}
  check_passed: "[CHECK] {stat}: rolled {roll}, needed {target} or less - passed."  # {roll}, {stat}, {target}
  check_failed: "[CHECK] {stat}: rolled {roll}, needed {target} or less - failed."  # {roll}, {stat}, {target}
  stat_changed: "[STAT] {stat}: {old} -> {new}"  # {new}, {old}, {stat}
  variable_changed: "[PERSISTENT] {name}: {old} -> {new}"  # {name}, {new}, {old} (empty text hides it)

  # --- Events
  event_start: "[EVENT] {title}: {description}"  # {description}, {title}
  event_trigger_result: "{title} begins."  # {title}
  event_chain: "[EVENT END] {title} gives way to a new situation."  # {title}
  event_end_return: "[EVENT END] {title} is over. You are back in the {location}."  # {location}, {title}
  event_end_moved: "[EVENT END] {title} is over. The outcome carried you to {location}."  # {location}, {title}
  event_unknown: "[EVENT] Unknown event '{event}' was ignored."  # {event}
  unexpected_event: "[UNEXPECTED EVENT] {description}"  # {description}
  unexpected_effect: "[EVENT EFFECT] Health {health:+d}, coins {coins:+d}."  # {coins}, {health}
  unexpected_discovery: "[EVENT DISCOVERY] A path opens to {location}."  # {location}

  # --- The story's beats (core_engine/story_beats.py, npc_roles, climax, travel, stakes, memory)
  npc_reveal: "[REVEAL] {npc}, the {role} of this story: {description}"  # {npc} {role} {description}: meeting someone who matters (npc_roles importance 2+)
  npc_named: "[LEAD] {npc} speaks of {target}, a {role} in all this: look for them at the {location}."  # {npc} {target} {role} {location}
  npc_triumph: "[TRIUMPH] You have beaten {npc}, the {role}."  # {npc} {role}
  climax_start: "[CLIMAX] {title}: it all comes down to this."  # {title}
  climax_won: "[CLIMAX] You prevail: {title} is yours."  # {title}
  climax_setback: "[SETBACK] {antagonist} throws you back. Catch your breath; this is not over."  # {antagonist}
  climax_price: "[CLIMAX] Bloodied and spent, you prevail at last; {title} cost you dearly."  # {title}
  revelation: "[REVELATION] At last it makes sense, what you learned at the {place}: \"{text}\""  # {place} {text}: an open thread closed at the climax
  another_way_witness: "[ANOTHER WAY] Someone saw it all: {npc} beckons you over."  # {npc}
  another_way_lead: "[ANOTHER WAY] The failure teaches you something: the answer may lie at the {location}."  # {location}
  refund: "[REFUND] Not everything is lost: you get {coins} coins back (Balance: {balance})."  # {coins} {balance}
  result_again: "RESULT: {description} It goes much as it did before."  # {description}: an outcome told a second time (variation; a list of texts varies it)
  result_habit: "RESULT: {description} The same again; people here are starting to know your face."  # {description}: told a third time or more
  travel_fast: "Travel by known ways to the {location}"  # {location}: the fast-travel option
  travel_fast_result: "By ways you know, through the {via}, you reach the {location}."  # {location} {via}
  on_the_way: "[ON THE WAY] {text}"  # {text}: a first trip's scene (travel.first_trip)
  road_word: "[ON THE WAY] Word on the road: {npc} is to be found in the {location}."  # {npc} {location}
  alert_up: "[ALERT] {text} (alert {level}/{max})"  # {text} {level} {max}
  alert_calm: "[ALERT] Things have calmed down (alert {level}/{max})."  # {level} {max}
  manhunt: "[MANHUNT] The whole watch is after you!"  # (also {location})
  secret: "[SECRET] {text}"  # {text}: an NPC's secret comes out
  consequence: "[CONSEQUENCE] {text}"  # {text}: something done earlier shows now
  last_time: "[LAST TIME] Last time you {text}."  # {text}: the profile's last story (memory)
  remembered_friend: "[LAST TIME] {npc} remembers you, and smiles."  # {npc}
  remembered_foe: "[LAST TIME] {npc} remembers you, and not fondly."  # {npc}
  mission_pool_done: "[MISSION] Every goal of this world has been achieved in this save game: explore freely."  # no goal is left for this save game (progression.goals_once)
  end_abandoned: "The traveler sets the story aside for now."  # a session ended by the player
  resumed: "[RESUMED] The story goes on in the {location}."  # a session continued from the UNP's parameters (also {turns})
  # People and factions (core_engine/relationships.py)
  npc_now_hostile: "[RELATIONSHIP] {npc} now counts you an enemy."  # {npc}: a disposition transition the player can know of
  npc_now_wary: "[RELATIONSHIP] {npc} grows wary of you."  # {npc}
  npc_now_neutral: "[RELATIONSHIP] {npc} no longer feels strongly about you."  # {npc}
  npc_now_friendly: "[RELATIONSHIP] {npc} warms to you."  # {npc}
  faction_now_hostile: "[FACTION] The {faction} turn against you."  # {faction}
  faction_now_neutral: "[FACTION] The {faction} no longer hold strong feelings about you."  # {faction}
  faction_now_friendly: "[FACTION] The {faction} look on you with favour."  # {faction}
  npc_offer_quest: "{npc} has something to ask of you."  # {npc} (also {location} {faction}): a reaction without its own text
  npc_request_help: "{npc} asks for your help."  # {npc} (also {location} {faction})
  npc_warn: "[WARNING] {npc} warns you: trouble is coming."  # {npc} (also {location} {faction})
  npc_confront: "[CONFRONTATION] {npc} confronts you about what you did."  # {npc} (also {location} {faction})
  npc_praise: "{npc} speaks well of you."  # {npc} (also {location} {faction})
  npc_threaten: "{npc} makes it plain you are not welcome here."  # {npc} (also {location} {faction})
  npc_moves: "[PEOPLE] {npc} leaves for the {location}."  # {npc} {location}
  npc_seeks: "{npc} seeks you out."  # {npc}: a reaction brings them to the player
  npc_hostile_talk: "{npc} refuses to speak with you."  # {npc}: talking with someone hostile
  npc_reaction: "{text}"  # {text}: a reaction's own text (also {npc})
