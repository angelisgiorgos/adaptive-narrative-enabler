    - Gold Coins
    goals:
    - Maintain order
    - Collect bribes
    descriptions:
    - A tired-looking guard leaning on a pike.
    - He looks like he'd rather be anywhere else but here.
    - He's always watching for troublemakers with a cynical eye.
    - He's secretly hoping for a quiet shift so he can nap.
    actions:
    - id: gate_guard_give_drink
      name: Give him the {alcohol_desc}
      exclusive_group: get_past_gate_guard
      required_tag: alcohol
      consumes_object: true
