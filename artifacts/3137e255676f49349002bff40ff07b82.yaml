world_definition:
  events:
    confront_thief:
      title: Confronting the thief
      tags:
      - threat
      - market
      - confrontation
      descriptions:
      - You grab the thief by the collar before they can slip into the crowd.
      - The thief freezes as you block the only gap between two stalls.
      actions:
      - name: Fight the thief
        outcomes:
        - desc: A short scuffle ends with the thief fleeing empty-handed, leaving
            a purse behind.
          tags:
          - combat
          - success
          coin_change: 10
          remove_npc: true
          set_variables:
            thief_caught: true
          change_variables:
            reputation: -1
        - desc: The thief lands a quick jab and escapes into the crowd.
          tags:
          - combat
          - threat
          - failure
          health_change: -2
          remove_npc: true
      - name: Interrogate the thief
        skill_check:
          stat: persuasion
          modifier: -10
        outcomes:
        - desc: Cornered, the thief admits they sell stolen goods to someone in the
            sewers.
          on_check: pass
          tags:
          - social
          - setup_clue
          reveal_location: Sewers
          set_variables:
            fence_exposed: true
        - desc: In exchange for their freedom, the thief leads you down to their hideout
            in the sewers.
          on_check: pass
          tags:
          - social
          - discovery
          move_to: Sewers
          remove_npc: true
          set_variables:
            fence_exposed: true
        - desc: The thief laughs in your face, slips your grip and vanishes into the
            crowd.
          on_check: fail
          tags:
          - social
          - failure
          remove_npc: true
      - name: Steal from the thief
        outcomes:
        - desc: While they protest their innocence, you lift a stolen pouch from their
            belt.
          tags:
          - stealth
          - success
          coin_change: 15
          change_variables:
            reputation: -1
        - desc: A market guard sees you rummaging through the thief's pockets and
            drives you both off.
          tags:
          - stealth
          - threat
          - failure
          health_change: -1
          move_to: Alley
    bandit_ambush:
      title: Ambushed by a bandit
      tags:
      - threat
      - ambush
      descriptions:
      - A hooded figure steps out of the shadows, blade first. "Your purse or your
        life."
      - A jagged knife presses against your ribs before you even hear footsteps.
      actions:
      - name: Fight for your life
        required_tag: weapon
        outcomes:
        - desc: With a swift strike, you drive the bandit away.
          tags:
          - combat
          - success
          remove_npc: true
        - desc: The bandit is skilled; they leave you bleeding in the gutter.
          tags:
          - combat
          - threat
          - failure
          health_change: -4
      - name: Hand over your coins
        outcomes:
        - desc: The bandit snatches your purse and melts back into the dark.
          tags:
          - threat
          coin_change: -10
          remove_npc: true
      - name: Plead for mercy
        outcomes:
        - desc: They take your coins and leave you bruised but alive.
          tags:
          - threat
          coin_change: -20
          health_change: -1
          remove_npc: true
        - desc: The bandit has no mercy; they strike you down where you stand.
          tags:
          - threat
          health_change: -5
      - name: Make a run for it
        skill_check:
          stat: stealth
        outcomes:
        - desc: You duck under the blade and lose the bandit in the crowd.
          on_check: pass
          tags:
          - stealth
          - success
        - desc: The bandit catches your cloak and slashes before you break free.
          on_check: fail
          tags:
          - threat
          - failure
          health_change: -2
    memory_theft:
      title: The Memory Thief strikes
      tags:
      - spectral
      - threat
      descriptions:
      - Mirrored eyes find yours, and a memory you have not made yet starts to slip
        away.
      actions:
      - name: Defend your memories
        outcomes:
        - desc: You trap the thief inside a borrowed recollection.
          tags:
          - combat
          - success
          - payoff_2
          remove_npc: true
        - desc: The thief steals the memory of how you arrived here.
          tags:
          - threat
          - failure
          - unexpected
          health_change: -2
      - name: Offer a false memory
        outcomes:
        - desc: The forgery satisfies the thief, who reveals the ghostline entrance.
          tags:
          - stealth
          - social
          - success
          reveal_location: Ghostline Station
  spawn_strategy: similarity
  similarity_threshold: 0.5
  objects:
  - name: Ancient Map
    associated_tags:
    - urban
    - alley
    interact_prompts:
    - Examine the map
    - Study the faded markings
    goals:
    - Discovery
    - Navigation
    descriptions:
    - A brittle, yellowed map showing secret city tunnels.
    - The ink is faded, but you can see a route to the Palace.
    actions:
    - id: ancient_map_study
      name: Study the map
      repeat: once
      outcomes:
      - id: ancient_map_route_to_palace
        desc: The traveler discovers a hidden route to the Palace.
        tags:
        - spawn
        spawn: true
        linked_location: Palace
  - name: Vintage Wine
    stat_bonus:
      persuasion: 5
    collectible: true
    associated_tags:
    - social
    - urban
    - alcohol
    interact_prompts:
    - Grab the bottle
    - Pick up the wine
    goals:
    - Collection
    - Bribe
    descriptions:
    - A dusty bottle of vintage red wine.
    - The labeling is in a prestigious script; a perfect bribe.
    actions:
    - id: vintage_wine_collect
      name: Collect the wine
      collects_object: Vintage Wine
      outcomes:
      - id: vintage_wine_collect_success
        desc: The traveler pockets a bottle of fine wine.
        tags:
        - stealth
  - name: Steel Dagger
    stat_bonus:
      attack: 15
    collectible: true
    associated_tags:
    - urban
    - alley
    - weapon
    - combat
    - fight
    interact_prompts:
    - Pick up the dagger
    - Arm yourself
    goals:
    - Self-defense
    - Combat
    descriptions:
    - A sharp, well-balanced steel blade.
    - The edge is keen and ready for a fight.
    actions:
    - name: Collect the dagger
      collects_object: Steel Dagger
      outcomes:
      - desc: The traveler arms themselves with the steel dagger.
        tags:
        - neutral
        - success
  - name: Heavy Shield
    stat_bonus:
      defence: 20
    collectible: true
    associated_tags:
    - guarded
    - palace
    - defense
    - combat
    interact_prompts:
    - Take the shield
    - Heave the shield onto your arm
    goals:
    - Protection
    descriptions:
    - A sturdy oak shield reinforced with iron bands.
    - It's heavy, but it offers excellent protection.
    actions:
    - name: Collect the shield
      collects_object: Heavy Shield
      outcomes:
      - desc: The traveler takes up the heavy shield.
        tags:
        - neutral
        - success
  - name: Gold Coins
    collectible: false
    associated_tags:
    - trade
    - poverty
    descriptions:
    - A few clinking gold coins.
    - Hard currency for hard places.
  - name: Antique Statue
    associated_tags:
    - nature
  - name: Rusty Sword
    stat_bonus:
      attack: 5
    associated_tags:
    - damp
  - name: Fence's Ledger
    stat_bonus:
      persuasion: 10
    enabled_if:
      fence_exposed: true
    collectible: true
    associated_tags:
    - underground
    - foul
    descriptions:
    - A water-stained ledger listing every stolen treasure and who paid for it.
    actions:
    - name: Read the ledger
      outcomes:
      - desc: One buyer appears on every page, with a key to a strongroom in the Vault.
        tags:
        - discovery
        - payoff_1
        reveal_location: Vault
        change_variables:
          reputation: 1
    - name: Take the ledger
      collects_object: Fence's Ledger
      outcomes:
      - desc: You tuck the ledger under your cloak. Someone will pay dearly for it.
        tags:
        - neutral
        - success
  locations:
    Harbor:
      tags:
      - urban
      - maritime
      - port
      - bustling
      - salty
      - district_docks
      - sea
      - dockworkers
      - ship
      - rum
      interact_prompts:
      - Walk to the docks
      - Approach the harbor
      - Head towards the sea
      - Check for available ships
      goals:
      - Find a ship
      - Hire a crew
      - Escape the navy
      distant_descriptions:
      - You hear the cries of seagulls and dockworkers in the distance.
      - Sails bob up and down on the waterfront.
      - 'There is a tang on the air: salt, fish, and sweat.'
      entered_descriptions:
      - You approach the harbor.
      - You enter the harbor.
      - The harbor is a flurry of activity.
      - There are drunk dockworkers everywhere in the place, trying to figure out
        how to leave the place
      interaction_points:
      - id: harbor_waterfront
        label: Waterfront
        prompt: Explore harbor
        linked_action: harbor_explore
        linked_location: Market
        notes: Sailors, gossip, and distant movement on the piers can open new routes.
      - id: harbor_crates
        label: Cargo crates
        prompt: Inspect the cargo crates
        linked_action: harbor_inspect_crates
        linked_outcome: harbor_crates_ledger
        linked_location: Palace
        linked_npc: Gate Guard
        notes: Manifests and contraband connect the harbor to the palace security
          story.
      actions:
      - id: harbor_explore
        name: Explore harbor
        outcomes:
        - id: harbor_explore_rest
          desc: The traveler relaxes by the sea, watching the ships roll in.
          tags:
          - neutral
        - id: harbor_explore_brawl
          desc: A brawl breaks out in a nearby tavern!
          tags:
          - threat
          health_change: -1
        - id: harbor_explore_market_rumor
          desc: The traveler overhears a sailor talking about a secret market.
          tags:
          - spawn
          spawn: true
          linked_location: Market
        - id: harbor_explore_compass
          desc: A discarded compass is found in the sand.
          tags:
          - setup_clue
      - id: harbor_inspect_crates
        name: Inspect the cargo crates
        outcomes:
        - id: harbor_crates_ledger
          desc: You find a ledger containing shipping routes to the Palace.
          tags:
          - setup_clue
          reveal_npc: Gate Guard
          linked_location: Palace
        - id: harbor_crates_contraband
          desc: A crate breaks, revealing illegal contraband!
          tags:
          - threat
          - guards
          health_change: -1
      - id: speak_to_the_dockworkers
        name: Join the dockworkers' discussion
        outcomes:
        - id: dockworkers_drunk
          desc: The dockworkers press a cup of rum into your hand and point out a
            faster route through the waterfront.
          tags:
          - social
          - spawn
          - success
          health_change: 1
          spawn: true
          linked_location: Market
        - id: dockworkers_warning
          desc: Between swigs, the dockworkers warn you that patrols have tightened
            around the palace road.
          tags:
          - social
          - setup_clue
          reveal_location: Palace
    Market:
      tags:
      - urban
      - trade
      - vibrant
      - crowded
      - cluttered
      - district_citadel
      interact_prompts:
      - Enter the market
      - Mingle with the shoppers
      - Approach the stalls
      goals:
      - Buy supplies
      - Gather information
      descriptions:
      - A sprawling labyrinth of stalls and vendors selling exotic wares from across
        the seven seas.
      - The market is a sensory overload; every corner reveals a new treasure or a
        new scam.
      actions:
      - name: Browse various stalls
        outcomes:
        - desc: A mysterious, glowing artifact is discovered.
          tags:
          - setup_clue
          reveal_object: Ancient Map
        - desc: A pickpocket tries to snatch your purse!
          tags:
          - threat
          health_change: -1
        - desc: A merchant offers you a map of the Palace.
          tags:
          - spawn
          spawn: true
        - desc: High-quality supplies are acquired.
          tags:
          - neutral
          - success
          health_change: 1
      - name: Investigate a strange commotion
        outcomes:
        - desc: A crowd is gathered around a street performer who is actually a scout
            for the Bandit.
          tags:
          - social
          reveal_npc: Bandit
        - desc: You find a dropped pouch of Gold Coins.
          tags:
          - neutral
          coin_change: 15
    Alley:
      tags:
      - urban
      - sleazy
      - dark
      - dangerous
      - narrow
      - district_slums
      interact_prompts:
      - Slip into the alley
      - Enter the narrow passage
      - Head into the shadows
      goals:
      - Find a contact
      - Avoid the guards
      descriptions:
      - A narrow, dimly lit passage between decaying buildings where shadows seem
        to move on their own.
      - The alley is damp and smells of rot; it's the perfect place for a meeting
        or an ambush.
      actions:
      - name: Sneak through the darkness
        outcomes:
        - desc: An abandoned hideout is located.
          tags:
          - neutral
        - desc: The traveler is ambushed by a group of thugs!
          tags:
          - threat
          health_change: -2
        - desc: A hidden tunnel leading out of the city is discovered.
          tags:
          - spawn
          spawn: true
    Palace:
      tags:
      - urban
      - palace
      - grand
      - guarded
      - luxury
      - district_citadel
      interact_prompts:
      - Approach the palace gates
      - Enter the royal halls
      - Ascend the marble stairs
      goals:
      - Steal the crown
      - Bribe a noble
      descriptions:
      - The magnificent seat of power, adorned with gold and guarded by elite sentinels.
      - The air inside is thick with incense and the sound of hushed whispers.
      actions:
      - name: Attempt to infiltrate
        outcomes:
        - desc: The traveler slips past the outer guards unnoticed.
          tags:
          - stealth
          - success
          reveal_object: Heavy Shield
        - desc: A sentinel spots you and raises the alarm!
          tags:
          - threat
          health_change: -2
        - desc: Whispers of a prisoner in the Dungeon are heard.
          tags:
          - spawn
          spawn: true
          reveal_location: Dungeon
        - desc: A room filled with ancient records is discovered.
          tags:
          - setup_clue
      - name: Eavesdrop on Nobles
        outcomes:
        - desc: You hear about Aurora's frequent visits to the Secret Garden.
          tags:
          - social
          reveal_npc: Aurora
          reveal_location: Secret Garden
    Dungeon:
      tags:
      - prison
      - dark
      - cold
      - damp
      - hopeless
      - district_slums
      interact_prompts:
      - Enter the cell
      - Descending into the dungeon
      - Head into the depths
      goals:
      - Escape
      - Free a prisoner
      descriptions:
      - A cold, damp subterranean prison carved into the very bedrock of the city.
      - The dungeon is pitch black, save for the occasional flickering torch.
      actions:
      - name: Search for an exit
        outcomes:
        - desc: The traveler finds a weakening in the cell bars.
          tags:
          - stealth
          - escape
          - success
          move_to: Sewers
        - desc: The jailer beats you during a regular inspection.
          tags:
          - threat
          health_change: -1
        - desc: A ghost appears, offering advice on how to escape.
          tags:
          - neutral
      - name: Talk to a nearby prisoner
        outcomes:
        - desc: An old man whispers about a secret tunnel in the Sewers.
          tags:
          - social
          reveal_location: Sewers
        - desc: The prisoner is too far gone to speak coherently.
          tags:
          - neutral
    Tavern:
      tags:
      - urban
      - social
      - noisy
      - information
      - district_docks
      interact_prompts:
      - Enter the tavern
      - Join the revelry
      - Push through the swing doors
      goals:
      - Hear rumors
      - Find a job
      descriptions:
      - A lively, smoke-filled establishment where tales are traded as freely as ale.
      - The tavern is packed with people from all walks of life, each with a story
        to tell.
      actions:
      - name: Listen to rumors
        outcomes:
        - desc: A drunkard mentions a hidden tunnel in the Alley.
          tags:
          - spawn
          spawn: true
          reveal_location: Alley
        - desc: You hear about an artifact being moved to the Vault.
          tags:
          - setup_clue
          reveal_location: Vault
        - desc: Only standard gossip and tall tales are heard.
          tags:
          - social
      - name: Participate in a drinking contest
        outcomes:
        - desc: You win! The patrons cheer and buy you a drink.
          tags:
          - social
          - success
          health_change: 1
          coin_change: 5
        - desc: You pass out and someone steals your coins.
          tags:
          - threat
          - failure
          coin_change: -10
    Vault:
      tags:
      - maritime
      - urban
      - sleazy
      - guarded
      - district_citadel
      interact_prompts:
      - Enter the vault
      - Creep into the vault
      - Approach the vault
      goals:
      - Steal
      - Plant evidence
      descriptions:
      - You are inside the vault, the heavy iron door sealing shut behind you.
      - The vault is cold and silent, save for the faint sound of dripping water.
      actions:
      - name: Search for loot
        outcomes:
        - desc: A bag of gold coins is found hidden in a corner.
          tags:
          - neutral
          - success
          coin_change: 20
        - desc: A trap is triggered! Poisonous needles fly from the walls.
          tags:
          - threat
          health_change: -2
      - name: Crack the main safe
        outcomes:
        - desc: You successfully open the safe! It contains the Crown Jewels.
          tags:
          - stealth
          - success
          reveal_object: Gold Coins
        - desc: The mechanism jams, sounding a silent alarm.
          tags:
          - threat
          - guards
          reveal_npc: Gate Guard
    Secret Garden:
      tags:
      - nature
      - serene
      - hidden
      - beautiful
      interact_prompts:
      - Enter the garden
      - Step into the oasis
      - Approach the fountain
      goals:
      - Meditate
      - Find rare herbs
      distant_descriptions:
      - The scent of blooming jasmine fills the air, seemingly coming from behind
        a high wall.
      - A hidden opening reveals a glimpse of lush greenery.
      entered_descriptions:
      - A hidden oasis of lush greenery and rare flowers, tucked away from the prying
        eyes of the city.
      - The garden is a masterpiece of landscape design, a tranquil escape from the
        bustling streets.
      actions:
      - name: Meditate by the fountain
        outcomes:
        - desc: Peace and clarity are found in the tranquility.
          health_change: 1
          tags:
          - neutral
    Sewers:
      tags:
      - dark
      - foul
      - underground
      - labyrinthine
      - district_slums
      interact_prompts:
      - Descend into the sewers
      - Enter the foul tunnels
      - Head into the darkness
      goals:
      - Navigate the waste
      - Find a hidden passage
      descriptions:
      - A dark, foul-smelling network of tunnels that run beneath the city streets.
      - The sewers are a labyrinth of dripping pipes and murky water.
      actions:
      - name: Search for a shortcut
        outcomes:
        - desc: You find a path that leads directly into the Palace basement.
          tags:
          - spawn
          spawn: true
          reveal_location: Palace
        - desc: You get lost in the muck for hours.
          tags:
          - threat
          health_change: -1
      - name: Confront the shadows
        outcomes:
        - desc: A bandit jumps from the darkness!
          tags:
          - threat
          - combat
          reveal_npc: Bandit
    Abandoned Church:
      tags:
      - abandoned
      - damp
      - narrow
      actions:
      - name: Explore Church
        outcomes:
        - desc: The Priest mentions a Guard.
          reveal_npc: Guard
    Market of the Ancients:
      tags:
      - crowded
      - commercial
      - luxury
      - arcane
      interact_prompts:
      - Enter the lantern-lit antique market
      - Follow the sound of chiming relics
      goals:
      - Find a forbidden relic
      - Learn who is buying royal secrets
      descriptions:
      - Stalls assembled from shipwreck timber display objects that seem older than
        the city itself.
      actions:
      - name: Shop for Antiques
        outcomes:
        - desc: The Merchant offers a rare artifact.
          tags:
          - social
          - discovery
          reveal_npc: Merchant
        - desc: A mirror shows tomorrow's palace guard rotation instead of your reflection.
          tags:
          - setup_clue
          - unexpected
          reveal_location: Palace
        - desc: A counterfeit idol cracks open and releases a cloud of sleeping dust.
          tags:
          - threat
          - arcane
          health_change: -1
      - name: Bid at the midnight auction
        outcomes:
        - desc: You win a sealed navigator's cylinder for a suspiciously low price.
          tags:
          - success
          - discovery
          reveal_object: Ancient Map
          coin_change: -5
        - desc: The auctioneer recognizes you and quietly calls for the Gate Guard.
          tags:
          - threat
          - guards
          reveal_npc: Gate Guard
    Storm Observatory:
      tags:
      - science
      - storm
      - heights
      - arcane
      - discovery
      - district_citadel
      interact_prompts:
      - Climb the lightning-scarred observatory
      - Follow the brass cables uphill
      goals:
      - Predict the supernatural storm
      - Decode the celestial machine
      distant_descriptions:
      - Copper vanes turn against the wind atop a tower webbed with blue lightning.
      entered_descriptions:
      - An enormous brass orrery maps stars that do not belong to this sky.
      actions:
      - name: Align the impossible constellations
        outcomes:
        - desc: The mechanism projects a route to an island hidden inside the storm.
          tags:
          - setup_clue
          - discovery
          - maritime
          reveal_location: Drowned Archive
        - desc: A false star falls from the mechanism and burns your hand.
          tags:
          - unexpected
          - threat
          - arcane
          health_change: -1
      - name: Ring the weather bell
        outcomes:
        - desc: The storm parts, exposing a bridge of rain toward the palace roofs.
          tags:
          - spawn
          - unexpected
          - success
          spawn: true
          reveal_location: Palace
        - desc: Thunder answers in a human voice and demands a secret.
          tags:
          - social
          - threat
          - arcane
          reveal_npc: Storm Cartographer
    Drowned Archive:
      tags:
      - maritime
      - underwater
      - ancient
      - mystery
      - discovery
      interact_prompts:
      - Descend the flooded library stairs
      - Enter through the cracked tide gate
      goals:
      - Recover the erased city history
      - Escape before the tide returns
      entered_descriptions:
      - Books drift like pale fish between submerged shelves while waterproof lanterns
        burn beneath the water.
      actions:
      - name: Read the breathing manuscript
        outcomes:
        - desc: The pages inhale and whisper the true name of the royal bloodline.
          tags:
          - setup_clue
          - arcane
          - discovery
          reveal_npc: Exiled Archivist
        - desc: The book bites down on your hand and drinks a memory.
          tags:
          - threat
          - unexpected
          health_change: -2
      - name: Open the pressure-sealed stacks
        outcomes:
        - desc: A hidden current carries you into the forgotten catacombs.
          tags:
          - spawn
          - discovery
          reveal_location: Bone Orchard
          spawn: true
        - desc: The returning tide scatters silver coins from a collapsed strongbox.
          tags:
          - success
          - maritime
          coin_change: 12
    Bone Orchard:
      tags:
      - nature
      - eerie
      - underground
      - ancient
      - payoff_clue
      interact_prompts:
      - Walk between the ivory trees
      - Follow the roots beneath the city
      goals:
      - Discover what feeds the orchard
      - Find the missing royal witnesses
      entered_descriptions:
      - White trees grow from old helmets, and their leaves repeat the final words
        of the dead.
      actions:
      - name: Ask the whispering leaves a question
        outcomes:
        - desc: The orchard confirms that the crown jewels are elaborate decoys.
          tags:
          - payoff_1
          - discovery
          - social
          reveal_location: Vault
        - desc: Every tree repeats your own voice confessing a crime you never committed.
          tags:
          - unexpected
          - threat
          reveal_npc: Memory Thief
      - name: Follow the youngest roots
        outcomes:
        - desc: The roots break through into a forgotten railway platform.
          tags:
          - spawn
          - exploration
          reveal_location: Ghostline Station
          spawn: true
        - desc: A medicinal white fruit restores your strength but changes your shadow.
          tags:
          - recovery
          - unexpected
          health_change: 2
    Ghostline Station:
      tags:
      - underground
      - travel
      - spectral
      - industrial
      - district_slums
      interact_prompts:
      - Step onto the abandoned platform
      - Follow the whistle beneath the streets
      goals:
      - Board the train that has no timetable
      - Learn where the missing passengers went
      entered_descriptions:
      - A transparent locomotive waits beneath stopped clocks, its windows full of
        passengers who cast no reflections.
      actions:
      - name: Board the ghostline
        outcomes:
        - desc: The train crosses the city in a heartbeat and leaves you beneath the
            palace.
          tags:
          - voyage
          - unexpected
          - success
          move_to: Palace
        - desc: The conductor demands a memory instead of a ticket.
          tags:
          - social
          - threat
          - spectral
          reveal_npc: Pale Conductor
      - name: Inspect the lost-property office
        outcomes:
        - desc: You recover a dagger tagged with tomorrow's date.
